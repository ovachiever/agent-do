<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Palingenesis — Engine Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1917; --surface:#211E1B; --lift:#272320;
  --ink:#E7E3DA; --muted:#A69D90; --faint:#6E675E;
  --line:rgba(231,227,218,0.14);
  --sage:hsl(158,30%,55%); --clay:hsl(12,42%,58%);
  --sage-dim:hsla(158,30%,55%,0.10); --clay-dim:hsla(12,42%,58%,0.10);
  --serif:'Source Serif 4', Georgia, serif;
  --sans:'Source Sans 3', -apple-system, 'Helvetica Neue', sans-serif;
  --mono:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:1px solid var(--sage);outline-offset:1px}
input{background:#161412;border:1px solid var(--line);color:var(--ink);padding:5px 10px;font-size:14px;font-family:var(--sans);min-height:28px}
input:focus{outline:none;border-color:var(--sage)}
input.bad{border-color:var(--clay)}
.mono{font-family:var(--mono)}
.tab{font-variant-numeric:tabular-nums}
.sage{color:var(--sage)} .clay{color:var(--clay)} .mutedc{color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1376px;margin:0 auto;padding:0 32px}

/* nav */
.nav{border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:30px;height:56px}
.word{font-family:var(--serif);font-size:20px;font-weight:600}
.tabs{display:flex;gap:22px;font-size:14px;color:var(--muted)}
.tabs span{padding:17px 0 15px}
.tabs .cur{color:var(--ink);border-bottom:2px solid var(--sage)}
.clockbox{margin-left:auto;text-align:right}
.clock{font-family:var(--mono);font-size:14px}
.clockdate{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* course band */
.band{border-bottom:1px solid var(--line);background:var(--surface)}
.band-in{display:flex;align-items:center;gap:16px;min-height:48px;padding:8px 0;flex-wrap:wrap}
.course-val{font-size:15px}
.course-prov{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);padding:5px 14px;min-height:28px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--muted);background:var(--lift)}
.cform{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cform .flab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* crumb + lede */
.crumb{display:flex;align-items:baseline;gap:10px;margin-top:18px;min-height:22px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.crumb button{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--faint);padding-bottom:1px}
.crumb button:hover{color:var(--ink);border-color:var(--muted)}
.crumb .rid{font-family:var(--mono);font-size:13px;letter-spacing:.02em;color:var(--sage)}
.crumb .hint{margin-left:auto;font-weight:400;letter-spacing:.06em}
.lede{font-family:var(--serif);font-size:21px;line-height:1.5;margin-top:6px;max-width:1140px}
.lede .lw{font-weight:600}

/* panels + blocks */
.panel{border:1px solid var(--line);background:var(--surface);border-radius:2px;margin-top:16px}
.rowflex{display:flex}
.rowflex>.blk{flex:1;border-left:1px solid var(--line);min-width:0}
.rowflex>.blk:first-child{border-left:none}
.blk{padding:12px 16px 12px;display:flex;flex-direction:column;min-height:120px;position:relative}
.blk.short{min-height:96px}
.bt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cue{color:var(--faint);font-size:14px;line-height:1}
.clk{cursor:pointer}
.clk:hover{background:var(--lift)}
.clk:hover .cue{color:var(--sage)}
.job{font-size:12px;color:var(--muted);margin-top:2px}
.num{margin-top:auto;text-align:right}
.fig{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.2}
.fig.dash{color:var(--muted)}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;display:flex;justify-content:flex-end;align-items:center;gap:6px;min-height:24px}
.state{font-size:12px;font-weight:600;margin-top:3px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.state.mono{text-transform:none;letter-spacing:0;font-weight:400;font-size:13px}
.st-sage{color:var(--sage)} .st-clay{color:var(--clay)}
.pencil{width:24px;height:24px;display:none;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent;font-size:13px}
.blk:hover .pencil{display:inline-flex}
.pencil:hover{color:var(--sage);border-color:var(--line)}
.step{display:inline-flex;gap:5px;align-items:center}
.step button{min-width:24px;height:24px;border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.step button:hover{border-color:var(--sage);color:var(--sage)}
.step .stv{font-family:var(--mono);font-size:14px;min-width:44px;text-align:center}

/* strips (receipts) */
.strip{border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.strip .slab{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);padding:2px 8px;min-height:24px;font-size:13px;color:var(--ink)}
.chip .mono{font-size:12px;color:var(--muted)}
.chip:hover{border-color:var(--sage)} .chip:hover .mono{color:var(--sage)}
.chip.struckchip .mono{color:var(--clay);text-decoration:line-through}
.eq{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;margin-left:4px}
.eqnote{color:var(--muted)}
.svcline{font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--ink);word-break:break-word}
.svcline .mutedc{color:var(--muted)}

/* timetable */
.panel-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line);gap:12px}
.legend{font-size:12px;color:var(--muted);font-family:var(--mono)}
.tt{display:flex}
.tt-lab{flex:0 0 100px;border-right:1px solid var(--line)}
.lhead{height:64px;border-bottom:1px solid var(--line)}
.lrowlab{height:42px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;border-bottom:1px solid var(--line)}
.lrowlab:last-child{border-bottom:none}
.lstage{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lsvc{font-size:12px;color:var(--muted)}
.tt-col{flex:1;min-width:0;border-right:1px solid var(--line);cursor:pointer;position:relative}
.tt-col:last-child{border-right:none}
.tt-col:hover{background:var(--lift)}
.tt-head{height:64px;padding:8px 8px 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.hh{font-family:var(--mono);font-size:14px}
.hid{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hid.struckid{color:var(--clay);text-decoration:line-through}
.hst{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tt-cell{height:42px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:0 8px;font-family:var(--mono);font-size:14px}
.tt-cell:last-child{border-bottom:none}
.t-future{color:var(--faint)}
.t-book{color:var(--faint);text-decoration:line-through}
.sub{font-size:12px;line-height:1.2}
.cell-live{background:var(--sage-dim)}
.runview .tt-col:not(.sel){opacity:.55}
.runview .tt-col:not(.sel):hover{opacity:1}
.tt-col.sel{flex:0 0 172px;background:hsla(158,30%,55%,.06);box-shadow:inset 0 0 0 1px var(--sage);opacity:1}
.pair{font-size:13px;white-space:nowrap}
.pair .pb{color:var(--muted)}
.rerun{display:none;position:absolute;top:4px;right:4px;width:24px;height:24px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:13px;align-items:center;justify-content:center;z-index:2}
.runview .tt-col:hover .rerun{display:inline-flex}
.rerun:hover{color:var(--sage);border-color:var(--sage)}
.queued{position:absolute;top:8px;right:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sage)}

/* rows inside sched/data blocks */
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.drow .dk{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
.drow .dv{font-family:var(--mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.drow.clk{margin:0 -16px;padding-left:16px;padding-right:16px}
.bstrip{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.figrow{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 10px}
.figrow .state{margin-top:0}

/* papers */
.prow{display:flex;gap:14px;align-items:baseline;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer}
.prow:hover{background:var(--lift)}
.prow:hover .cue{color:var(--sage)}
.pt{flex:1;font-size:15px;min-width:0}
.pj{flex:0 0 205px;color:var(--muted);font-size:13px}
.pk{flex:0 0 66px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.pm{flex:0 0 60px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.prow .cue{flex:0 0 14px;text-align:right}
.pdetail{padding:6px 16px 10px;background:#1E1B18;font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.pempty{padding:14px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}

/* log */
.lrow{display:flex;gap:14px;align-items:baseline;padding:8px 16px;border-top:1px solid var(--line)}
.lt{flex:0 0 52px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.ltx{flex:1;font-size:15px;min-width:0}
.lright{flex:0 0 96px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.erik{display:inline-block;border:1px solid var(--sage);color:var(--sage);font-size:12px;font-weight:600;letter-spacing:.08em;padding:0 7px;text-transform:uppercase}
.runchip{font-family:var(--mono);font-size:13px;color:var(--sage);border:1px solid var(--line);padding:1px 7px;margin-left:8px;cursor:pointer;white-space:nowrap}
.runchip:hover{border-color:var(--sage)}
.logfoot{padding:8px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.logfoot button{color:var(--muted);border-bottom:1px solid var(--faint);font-size:13px}
.logfoot button:hover{color:var(--ink)}
@keyframes freshBg{from{background:var(--sage-dim)}to{background:transparent}}
.fresh{animation:freshBg 2.2s ease-out}
.pulse{animation:freshBg 1.6s ease-out}

/* helm */
.so{display:flex;border-top:1px solid var(--line)}
.so-lab{flex:0 0 100px;padding:12px 16px;display:flex;align-items:center}
.so-cell{flex:1;padding:10px 16px;border-left:1px solid var(--line);position:relative}
.so-k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.so-v{font-family:var(--mono);font-size:14px;margin-top:2px}
.so-p{font-size:12px;color:var(--muted);margin-top:1px}
.so-edit{display:flex;gap:6px;align-items:center;margin-top:3px}
.so-edit input{font-family:var(--mono);font-size:13px;width:150px;min-height:24px;padding:2px 8px}
.mini{min-width:24px;height:24px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.mini:hover{border-color:var(--sage);color:var(--sage)}
.ctl{display:flex;align-items:center;gap:20px;padding:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.suspend{border:1px solid var(--clay);color:var(--clay);padding:11px 22px;min-height:44px;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.suspend:hover{background:var(--clay-dim)}
.suspend.confirm{background:var(--clay);color:#1B1917}
.suspend.confirm:hover{background:var(--clay)}
.suspend.resume{border-color:var(--sage);color:var(--sage)}
.suspend.resume:hover{background:var(--sage-dim)}
.keep{border:1px solid var(--line);color:var(--muted);padding:11px 18px;min-height:44px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.keep:hover{color:var(--ink);border-color:var(--muted)}
.conseq{font-size:14px;color:var(--muted);max-width:620px}

/* footer */
.foot{margin:28px 0 44px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:13px}
</style>
</head>

/* ---------- helpers ---------- */
function $id(x){ return document.getElementById(x); }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtT(min){ return pad2(Math.floor(min/60)%24) + ':' + pad2(min%60); }
function money(c){ return '$' + (c/100).toFixed(2); }
function runByGrid(id){ for (var i=0;i<RUNS.length;i++) if (RUNS[i].id===id) return RUNS[i]; return null; }
function sMin(r,si){ return r.hour*60 + OFF[si]; }
function sAct(r,si){
  if (r.status==='booked' || r.status==='next') return null;
  if (r.status==='struck') return si===0 ? sMin(r,0) : null;
  if (r.status==='live')   return si<=3 ? sMin(r,si) : null;
  var a = sMin(r,si);
  if (r.lf!==null && si>=r.lf) a += r.lm;
  return a;
}
function runTotal(r){ var t=0, any=false; r.cost.forEach(function(c){ if(c!==null){t+=c;any=true;} }); return any? t : null; }
function claimsOf(r){ var t=0; r.papers.forEach(function(p){ t+=p[2]; }); return t; }
function consideredOf(r){ var t=0; r.papers.forEach(function(p,i){ t += p[2]+2+(i%3); }); return t; }
function volsOf(r){
  return {
    sources:r.src,
    papers:r.papers.length,
    claims:claimsOf(r),
    trials:(r.status==='closed'||r.status==='live')?1:0,
    verdicts:r.status==='closed'?1:0,
    digests:r.status==='closed'?1:0
  };
}
function daySvcSpent(i){ var t=0; RUNS.forEach(function(r){ if(r.cost[i]!==null) t+=r.cost[i]; }); return t; }
function daySpent(){ var t=0; RUNS.forEach(function(r){ var x=runTotal(r); if(x!==null) t+=x; }); return t; }
function dayAllot(){ return state.allots.reduce(function(a,b){return a+b;},0); }
function dayVols(){
  var v={sources:0,papers:0,claims:0,trials:0,verdicts:0,digests:0};
  RUNS.forEach(function(r){ var x=volsOf(r); Object.keys(v).forEach(function(k){ v[k]+=x[k]; }); });
  return v;
}
function lostTotal(){
  var t=0; state.log.forEach(function(row){ if(row.lost) t+=parseFloat(row.lost); });
  return t.toFixed(1);
}
function courseFor(n){
  for (var i=state.courses.length-1;i>=0;i--){
    var c=state.courses[i];
    if (c.from!==null && n>=c.from && n<=c.to) return c;
  }
  return null;
}
function parseCycles(s){
  var m = s.match(/(\d+)\s*[–-]\s*(\d+)/);
  if (m) return {from:parseInt(m[1],10), to:parseInt(m[2],10)};
  var one = s.match(/^(\d+)$/);
  if (one) return {from:parseInt(one[1],10), to:parseInt(one[1],10)};
  return {from:null, to:null};
}
var clockSec = 17*3600 + 26*60 + 8;
function clockHM(){ return fmtT(Math.floor(clockSec/60)); }
function addOrder(text){
  state.log.push({t:clockHM(), kind:'order', text:text, who:'Erik', fresh:true});
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function scopeRun(){ return state.scope==='day' ? null : runByGrid(state.scope); }

function bookedLede(r){
  var when = pad2(r.hour) + ':00:00';
  if (state.suspended) return 'Held — generation suspended; cycle ' + r.n + ' does not open until resume.';
  var c = courseFor(r.n);
  var head = (r.status==='next') ? 'Next' : 'Booked';
  return head + ' — opens ' + when + ' on course ' + (c ? c.topic : 'unset') + '; nothing spent.';
}

function renderCrumb(){

function ledeSplit(t){
  var i = t.indexOf(' — ');
  var w = i>0 ? t.slice(0,i) : '';
  var rest = i>0 ? t.slice(i) : t;
  var cls = '';
  if (/^Live/.test(w)) cls='sage';
  if (/^Struck|^Held/.test(w)) cls='clay';
  if (/^Suspended/.test(w)) cls='clay';
  return '<span class="lw ' + cls + '">' + esc(w) + '</span>' + esc(rest);
}
function renderLede(){
  var h;
  if (state.scope==='day'){
    var txt;
    if (state.suspended){
      txt = 'Suspended — ten cycles closed, one struck · ' + money(daySpent()) + ' of $' + dayAllot() + '.00 · cycle 12 runs to 17:41 · cycles 13–16 held.';
    } else {
      txt = 'Nominal — ten cycles closed, one struck · ' + money(daySpent()) + ' of $' + dayAllot() + '.00 spent · cycle 12 mid-Simulate · cycle 13 opens 18:00:00.';
    }
    h = ledeSplit(txt);
  } else {
    var r = scopeRun();
    h = ledeSplit(r.lede || bookedLede(r));
  }
  $id('lede').innerHTML = '<div class="lede">' + h + '</div>';
}

/* ---------- render: ledger ---------- */
function svcWindow(r,i){
  var a0 = sAct(r,i);
  if (a0===null){
    if (r.status==='struck') return {txt:'struck · not run', cls:'st-clay'};
    if (r.status==='live')   return {txt:'awaits ' + fmtT(sMin(r,i)), cls:''};
    return {txt:'awaits ' + fmtT(sMin(r,i)), cls:''};
  }
  if (i===5) return {txt:'at ' + fmtT(a0), cls:''};
  var a1 = sAct(r,i+1);
  if (a1===null){
    if (r.status==='live' && i===3) return {txt:fmtT(a0) + ' → live', cls:'st-sage'};
    return {txt:fmtT(a0) + ' → —', cls:''};
  }
  return {txt:fmtT(a0) + ' → ' + fmtT(a1), cls:''};
}
function svcAct(r,i){
  var v = volsOf(r);
  switch(i){
    case 0: return r.status==='struck' ? 'docket empty — struck 12:01' : 'stocked ' + v.sources + ' sources · docket dk-22' + r.nn;
    case 1: return v.papers ? 'read ' + v.papers + ' papers · kept ' + v.claims + ' claims' : 'nothing to read';
    case 2: return v.claims ? 'weighed ' + v.claims + ' claims · voted' : 'no claims to weigh';
    case 3: return r.status==='live' ? 'trial t-22' + r.nn + ' running' : (r.cost[3]!==null ? 'ran trial t-22' + r.nn + (r.n===9 ? ' · requeued ×1' : '') : 'no trial');
    case 4: return r.verdict ? 'wrote lineage ln-22' + r.nn + ' · recorded ' + r.verdict : 'writes lineage on record';
    case 5: return r.verdict ? 'posted digest d-22' + r.nn + ' · closed ' + fmtT(sAct(r,5)) : 'posts on close';
  }
  return '';
}
function dayStateFor(i){
  if (i===3) return {txt:'trial live', cls:'st-sage'};
  return {txt:['docket stocked','stack read','verdicts voted','','lineage current','ten posted'][i], cls:''};
}
function renderLedger(){
  var r = scopeRun();
  var h = '<div class="panel"><div class="rowflex">';

  /* DAY / RUN block */
  if (!r){
    var stDay = state.suspended ? '<span class="state st-clay">suspended</span>' : '<span class="state">nominal</span>';
    h += '<div class="blk clk" data-act="svc" data-svc="day" title="receipt — cost of every run">'
      +  '<div class="bt"><span class="label">Day</span><span class="cue">▸</span></div>'
      +  '<div class="job">sixteen cycles booked</div>'
      +  '<div class="num"><div class="fig">' + money(daySpent()) + '</div>'
      +  '<div class="meta">of $' + dayAllot() + '.00 · ≈$155.90 close</div>' + stDay + '</div></div>';
  } else {
    var tot = runTotal(r);
    var stTxt, stCls='';
    if (r.status==='closed'){ stTxt = r.lm>0 ? 'closed +' + r.lm : 'closed on book'; stCls = r.lm>=5 ? 'st-clay' : ''; }
    else if (r.status==='struck'){ stTxt='struck 12:01'; stCls='st-clay'; }
    else if (r.status==='live'){ stTxt='live · simulate'; stCls='st-sage'; }
    else { stTxt = state.suspended ? 'held' : 'opens ' + pad2(r.hour) + ':00'; stCls = state.suspended ? 'st-clay' : ''; }
    h += '<div class="blk clk" data-act="svc" data-svc="day" title="receipt — this run by service">'
      +  '<div class="bt"><span class="label">Run</span><span class="cue">▸</span></div>'
      +  '<div class="job mono">cycle ' + r.nn + ' · ' + r.id + '</div>'
      +  '<div class="num"><div class="fig' + (tot===null?' dash':'') + '">' + (tot===null?'—':money(tot)) + '</div>'
      +  '<div class="meta">of day ' + money(daySpent()) + '</div>'
      +  '<span class="state ' + stCls + '">' + stTxt + '</span></div></div>';
  }

  /* six services */
  SVC.forEach(function(s,i){
    if (!r){
      var spent = daySvcSpent(i);
      var editing = state.allotEdit && state.allotEdit.i===i;
      var metaIn;
      if (editing){
        metaIn = '<span class="step">'
          + '<button data-act="allot-dec" title="− $5">−</button>'
          + '<span class="stv">$' + state.allotEdit.val + '</span>'
          + '<button data-act="allot-inc" title="+ $5">+</button>'
          + '<button data-act="allot-set" title="set allot — appends an order">set</button>'
          + '<button data-act="allot-cancel" title="cancel">✕</button></span>';
      } else {
        metaIn = 'of $' + state.allots[i] + ' · ≈' + money(s.close)
          + '<button class="pencil" data-act="allot-edit" data-svc="' + i + '" title="edit allot — appends an order">✎</button>';
      }
      var st = dayStateFor(i);
      h += '<div class="blk clk" data-act="svc" data-svc="' + i + '" title="receipt — per-run ' + s.name.toLowerCase() + ' costs">'
        +  '<div class="bt"><span class="label">' + s.name + '</span><span class="cue">▸</span></div>'
        +  '<div class="job">' + s.job + '</div>'
        +  '<div class="num"><div class="fig">' + money(spent) + '</div>'
        +  '<div class="meta">' + metaIn + '</div>'
        +  '<span class="state ' + st.cls + '">' + st.txt + '</span></div></div>';
    } else {
      var c = r.cost[i];
      var w = svcWindow(r,i);
      h += '<div class="blk clk" data-act="svc" data-svc="' + i + '" title="' + s.name.toLowerCase() + ' line for ' + r.id + '">'
        +  '<div class="bt"><span class="label">' + s.name + '</span><span class="cue">▸</span></div>'
        +  '<div class="job">' + s.job + '</div>'
        +  '<div class="num"><div class="fig' + (c===null?' dash':'') + '">' + (c===null?'—':money(c)) + '</div>'
        +  '<div class="meta">day ' + money(daySvcSpent(i)) + ' of $' + state.allots[i] + '</div>'
        +  '<span class="state mono ' + w.cls + '">' + w.txt + '</span></div></div>';
    }
  });
  h += '</div>';

  /* receipt / service-line strip */
  if (state.svcDetail!==null){
    h += '<div class="strip">' + stripHTML() + '</div>';
  }
  h += '</div>';
  $id('ledger').innerHTML = h;
}
function stripHTML(){
  var r = scopeRun();
  if (!r){
    if (state.svcDetail==='day'){
      var chips = '';
      RUNS.forEach(function(x){
        var t = runTotal(x);
        if (t!==null){
          chips += '<button class="chip' + (x.status==='struck'?' struckchip':'') + '" data-act="rescope" data-run="' + x.id + '" title="rescope to ' + x.id + '">'
            + '<span class="mono">' + x.id + '</span><span class="tab">' + money(t) + '</span></button>';
        }
      });
      return '<span class="slab">Day receipt</span>' + chips
        + '<span class="eq">= ' + money(daySpent()) + '</span><span class="eqnote">· 13–16 not open</span>';
    }
    var i = state.svcDetail, chips2='';
    RUNS.forEach(function(x){
      if (x.cost[i]!==null){
        chips2 += '<button class="chip' + (x.status==='struck'?' struckchip':'') + '" data-act="rescope" data-run="' + x.id + '" title="rescope to ' + x.id + '">'
          + '<span class="mono">' + x.id + '</span><span class="tab">' + money(x.cost[i]) + '</span></button>';
      }
    });
    return '<span class="slab">' + SVC[i].name + ' receipt</span>' + chips2
      + '<span class="eq">= ' + money(daySvcSpent(i)) + ' of $' + state.allots[i] + '</span><span class="eqnote">· 13–16 not open</span>';
  }
  /* run scope: one service line */
  if (state.svcDetail==='day'){
    var parts = [];
    SVC.forEach(function(s,i){ if (r.cost[i]!==null) parts.push(s.name.toLowerCase() + ' ' + money(r.cost[i])); });
    var tot = runTotal(r);
    return '<span class="slab">Run receipt</span><span class="svcline">' + parts.join(' · ')
      + ' <span class="mutedc">=</span> ' + (tot===null?'—':money(tot)) + '</span>';
  }
  var i2 = state.svcDetail, s2 = SVC[i2], w = svcWindow(r,i2);
  return '<span class="slab">' + s2.name + ' line</span><span class="svcline">'
    + r.id + ' · ' + (r.cost[i2]===null?'—':money(r.cost[i2])) + ' · ' + w.txt + ' · ' + svcAct(r,i2) + '</span>';
}

/* ---------- render: timetable ---------- */
function headChip(r){
  if (r.status==='closed'){
    if (r.lm>0) return '<span class="hst' + (r.lm>=5?' clay':'') + '">closed +' + r.lm + '</span>';
    return '<span class="hst">closed</span>';
  }
  if (r.status==='struck') return '<span class="hst clay">struck</span>';
  if (r.status==='live')   return '<span class="hst sage">live</span>';
  if (state.suspended)     return '<span class="hst clay">held</span>';
  if (r.status==='next')   return '<span class="hst sage">next</span>';
  return '<span class="hst">booked</span>';
}
function cellHTML(r,si,selected){
  var b = sMin(r,si), a = sAct(r,si);
  var title = r.id + ' · ' + STAGES[si].l + ' · booked ' + fmtT(b) + (a!==null ? ' · actual ' + fmtT(a) : '');
  if (selected){
    var right;
    if (a!==null) right = '<span' + (a>b ? ' class="clay"':'') + '>' + fmtT(a) + '</span>';
    else if (r.status==='struck' && si>0) right = '<span class="clay">struck</span>';
    else right = '<span class="mutedc">—</span>';
    var sub = '';
    if (r.status==='live' && si===3) sub = '<span class="sub sage">live</span>';
    else if (r.lf===si && r.lm>0) sub = '<span class="sub ' + (r.lm>=5?'clay':'mutedc') + '">+' + r.lm + '</span>';
    return '<div class="tt-cell' + (r.status==='live'&&si===3?' cell-live':'') + '" title="' + title + '">'
      + '<span class="pair"><span class="pb">' + fmtT(b) + '</span> → ' + right + '</span>' + sub + '</div>';
  }
  /* compact cell */
  if (r.status==='booked' || r.status==='next'){
    return '<div class="tt-cell t-future" title="' + title + '">' + fmtT(b) + '</div>';
  }
  if (r.status==='struck'){
    if (si===0) return '<div class="tt-cell" title="' + title + '">' + fmtT(b) + '<span class="sub clay">feed empty</span></div>';
    return '<div class="tt-cell t-book" title="' + title + ' · struck — kept on book">' + fmtT(b) + '</div>';
  }
  if (r.status==='live'){
    if (si===3) return '<div class="tt-cell cell-live" title="' + title + '"><span class="sage">' + fmtT(b) + '</span><span class="sub sage">live</span></div>';
    if (si>3)  return '<div class="tt-cell t-future" title="' + title + '">' + fmtT(b) + '</div>';
    return '<div class="tt-cell" title="' + title + '">' + fmtT(a) + '</div>';
  }
  /* closed */
  var lateHere = (r.lf===si && r.lm>0);
  var h = '<div class="tt-cell" title="' + title + '">' + fmtT(a);
  if (lateHere) h += '<span class="sub ' + (r.lm>=5?'clay':'mutedc') + '">+' + r.lm + '</span>';
  return h + '</div>';
}
function renderTimetable(){
  var r = scopeRun();
  var h = '<div class="panel"><div class="panel-head"><span class="label">Timetable</span>'
    + '<span class="legend">one cycle per hour · 06:00–21:00 · six stages</span></div>';
  h += '<div class="tt' + (r ? ' runview' : '') + '">';
  h += '<div class="tt-lab"><div class="lhead"></div>';
  STAGES.forEach(function(s){
    h += '<div class="lrowlab"><span class="lstage">' + s.l + '</span><span class="lsvc">' + s.svc + '</span></div>';
  });
  h += '</div>';
  RUNS.forEach(function(x){
    var sel = r && x.id===r.id;
    h += '<div class="tt-col' + (sel?' sel':'') + '" data-act="rescope" data-run="' + x.id + '" title="rescope console to ' + x.id + '">';
    h += '<div class="tt-head"><span class="hh">' + pad2(x.hour) + ':00</span>'
      +  '<span class="hid' + (x.status==='struck'?' struckid':'') + '">' + x.id + '</span>' + headChip(x);
    if (r && (x.status==='closed' || x.status==='booked' || x.status==='next')){
      if (state.requeued[x.id]) h += '<span class="queued">queued</span>';
      else h += '<button class="rerun" data-act="rerun" data-run="' + x.id + '" title="re-run ' + x.id + ' — appends an order">↻</button>';
    }
    h += '</div>';
    for (var si=0; si<6; si++) h += cellHTML(x,si,sel);
    h += '</div>';
  });
  h += '</div></div>';
  $id('timetable').innerHTML = h;
}

/* ---------- render: volumes ---------- */
var VOLS = [
  {k:'sources', name:'Sources', st:'scouted'},
  {k:'papers',  name:'Papers',  st:'read'},
  {k:'claims',  name:'Claims',  st:'kept'},
  {k:'trials',  name:'Trials',  st:'run'},
  {k:'verdicts',name:'Verdicts',st:'recorded'},
  {k:'digests', name:'Digests', st:'posted'}
];
function renderVolumes(){
  var r = scopeRun();
  var v = r ? volsOf(r) : dayVols();
  var h = '<div class="panel"><div class="rowflex">';
  VOLS.forEach(function(x,i){
    h += '<div class="blk short clk" data-act="vol" data-vol="' + i + '" title="' + (r ? x.name.toLowerCase() + ' receipt for ' + r.id : 'receipt — ' + x.name.toLowerCase() + ' by run') + '">'
      +  '<div class="bt"><span class="label">' + x.name + '</span><span class="cue">▸</span></div>'
      +  '<div class="num"><div class="fig">' + v[x.k] + '</div>'
      +  '<span class="state">' + x.st + '</span></div></div>';
  });
  h += '</div>';
  if (state.volDetail!==null) h += '<div class="strip">' + volStripHTML() + '</div>';
  h += '</div>';
  $id('volumes').innerHTML = h;
}
function volStripHTML(){
  var r = scopeRun();
  var i = state.volDetail, x = VOLS[i];
  if (!r){
    var chips='', total=0;
    RUNS.forEach(function(run){
      var vv = volsOf(run)[x.k];
      var opened = run.status!=='booked' && run.status!=='next';
      if (opened && (vv>0 || x.k==='sources')){
        total += vv;
        chips += '<button class="chip' + (run.status==='struck'?' struckchip':'') + '" data-act="rescope" data-run="' + run.id + '" title="rescope to ' + run.id + '">'
          + '<span class="mono">' + run.id + '</span><span class="tab">' + vv + '</span></button>';
      }
    });
    return '<span class="slab">' + x.name + ' receipt</span>' + chips
      + '<span class="eq">= ' + total + ' ' + x.st + '</span>';
  }
  var v = volsOf(r), line='';
  switch(x.k){
    case 'sources': line = v.sources + ' stocked ' + fmtT(sMin(r,0)) + '–' + fmtT(sMin(r,1)) + ' · docket dk-22' + r.nn + (r.status==='struck'?' · feed empty':''); break;
    case 'papers':  line = v.papers ? v.papers + ' read — listed below in Papers' : 'none read'; break;
    case 'claims':  line = v.claims ? v.claims + ' kept of ' + consideredOf(r) + ' considered across ' + v.papers + ' papers' : 'none kept'; break;
    case 'trials':  line = v.trials ? 'trial t-22' + r.nn + ' · ' + svcWindow(r,3).txt + (r.n===9?' · requeued ×1':'') : 'no trial'; break;
    case 'verdicts':line = r.verdict ? r.verdict + ' recorded ' + fmtT(sAct(r,4)) : 'none recorded'; break;
    case 'digests': line = r.verdict ? 'd-22' + r.nn + ' posted ' + fmtT(sAct(r,5)) : 'none posted'; break;
  }
  return '<span class="slab">' + x.name + '</span><span class="svcline">' + line + '</span>';
}

/* ---------- render: papers (run view) ---------- */
function renderPapers(){
  var r = scopeRun();
  if (!r){ $id('papers').innerHTML=''; return; }
  var v = volsOf(r);
  var h = '<div class="panel" id="paperspanel"><div class="panel-head"><span class="label">Papers</span>'
    + '<span class="legend">' + v.papers + ' read · ' + v.claims + ' claims kept · reader ' + (r.cost[1]===null?'$0.00':money(r.cost[1])) + '</span></div>';
  if (!r.papers.length){
    var msg = r.status==='struck'
      ? 'No papers — feed empty at open; docket dk-22' + r.nn + ' held zero sources at 12:01.'
      : 'None yet — cycle opens ' + pad2(r.hour) + ':00:00.';
    h += '<div class="pempty">' + msg + '</div>';
  } else {
    r.papers.forEach(function(p,i){
      h += '<div class="prow" data-act="paper" data-i="' + i + '" title="receipt for this paper">'
        +  '<span class="pt">' + esc(p[0]) + '</span>'
        +  '<span class="pj">' + esc(p[1]) + '</span>'
        +  '<span class="pk">' + p[2] + ' kept</span>'
        +  '<span class="pm">' + money(p[3]) + '</span>'
        +  '<span class="cue">▸</span></div>';
      if (state.paperOpen===i){
        var considered = p[2] + 2 + (i%3);
        h += '<div class="pdetail">read ' + fmtT(sAct(r,1)+i) + ' · kept ' + p[2] + ' of ' + considered
          +  ' claims · ' + money(p[3]) + ' · lineage ln-22' + r.nn + '-' + (i+1) + ' · source archived</div>';
      }
    });
  }
  h += '</div>';
  $id('papers').innerHTML = h;
}

/* ---------- render: scheduler + data ---------- */
function renderSched(){
  var r = scopeRun();
  var h = '<div class="panel"><div class="rowflex">';

  /* SCHEDULER */
  h += '<div class="blk">';
  h += '<div class="bt"><span class="label">Scheduler</span><span class="cue" title="cadence, late rule, clock">▸</span></div>';
  if (!r){
    var figS = state.suspended ? '<span class="clay">held</span>' : '18:00:00';
    var stS  = state.suspended ? '<span class="state st-clay">resume to reopen</span>' : '<span class="state">next open · cycle 13 · r-2213</span>';
    h += '<div class="figrow"><div class="fig' + (state.suspended?' dash':'') + '">' + figS + '</div>' + stS + '</div>';
    h += '<div class="drow clk" data-act="sched" data-key="cadence" title="cadence receipt"><span class="dk">Cadence</span><span class="dv">one open per hour · 06:00–21:00</span></div>';
    h += '<div class="drow clk" data-act="sched" data-key="late" title="late-rule receipt"><span class="dk">Late rule</span><span class="dv">struck ' + esc(state.so[1].val) + ' · worst +21</span></div>';
    h += '<div class="drow clk" data-act="sched" data-key="next" title="rescope to r-2213"><span class="dk">Next open</span><span class="dv">' + (state.suspended ? 'held' : '18:00:00 · r-2213') + '</span></div>';
    h += '<div class="drow clk" data-act="sched" data-key="clock" title="clock receipt"><span class="dk">Clock</span><span class="dv">farm local · UTC−05</span></div>';
    if (state.schedDetail) h += '<div class="bstrip">' + schedStrip() + '</div>';
  } else {
    var openB = pad2(r.hour) + ':00:00';
    var stTxt2, figR = openB;
    if (r.status==='closed') stTxt2 = 'closed ' + fmtT(sAct(r,5)) + (r.lm>0 ? ' (+' + r.lm + ')' : ' on book');
    else if (r.status==='struck') stTxt2 = 'struck 12:01 · kept on book';
    else if (r.status==='live') stTxt2 = 'live · close booked 17:41';
    else stTxt2 = state.suspended ? 'held — does not open' : 'opens on book';
    h += '<div class="figrow"><div class="fig">' + figR + '</div><span class="state mono">' + stTxt2 + '</span></div>';
    h += '<div class="drow"><span class="dk">Booked</span><span class="dv">' + fmtT(sMin(r,0)) + ' → ' + fmtT(sMin(r,5)) + '</span></div>';
    var actLine;
    if (r.status==='closed') actLine = fmtT(sAct(r,0)) + ' → ' + fmtT(sAct(r,5)) + (r.lm>0 ? ' <span class="' + (r.lm>=5?'clay':'mutedc') + '">+' + r.lm + '</span>' : '');
    else if (r.status==='struck') actLine = fmtT(sAct(r,0)) + ' → <span class="clay">struck 12:01</span>';
    else if (r.status==='live') actLine = fmtT(sAct(r,0)) + ' → <span class="sage">live</span>';
    else actLine = '<span class="mutedc">—</span>';
    h += '<div class="drow"><span class="dk">Actual</span><span class="dv">' + actLine + '</span></div>';
    h += '<div class="drow"><span class="dk">Late rule</span><span class="dv">struck ' + esc(state.so[1].val) + (r.n===9 ? ' · cleared at +21' : '') + '</span></div>';
  }
  h += '</div>';

  /* DATA */
  h += '<div class="blk">';
  h += '<div class="bt"><span class="label">Data</span><span class="cue" title="snapshot, archive, backfill">▸</span></div>';
  if (!r){
    h += '<div class="figrow"><div class="fig">17:15:09</div><span class="state">snapshot · 412 MB · <span class="sage">verified</span></span></div>';
    h += '<div class="drow clk" data-act="data" data-key="archive" title="archive receipt"><span class="dk">Archive</span><span class="dv">1,283 runs · 9.6 GB · to 16:43</span></div>';
    h += '<div class="drow clk" data-act="data" data-key="backfill" title="backfill receipt"><span class="dk">Backfill</span><span class="dv">0 owed · last repair Aug 19</span></div>';
    h += '<div class="drow clk" data-act="data" data-key="snap" title="snapshot receipt"><span class="dk">Next snap</span><span class="dv">18:15:00 · ' + esc(state.so[3].val) + '</span></div>';
    if (state.dataDetail) h += '<div class="bstrip">' + dataStrip() + '</div>';
  } else {
    var lin = (r.status==='closed') ? 'ln-22' + r.nn : '—';
    var linSt = (r.status==='closed') ? 'lineage archived' : (r.status==='live' ? 'lineage pending record' : (r.status==='struck' ? 'strike on book' : 'no lineage yet'));
    h += '<div class="figrow"><div class="fig' + (lin==='—'?' dash':'') + '">' + lin + '</div><span class="state mono">' + linSt + '</span></div>';
    var cov = (r.status==='closed') ? 'covered to 16:43 ✓' : 'lands in 18:15:00 snap';
    if (r.status==='booked'||r.status==='next') cov = 'not yet on book';
    h += '<div class="drow"><span class="dk">Snapshot</span><span class="dv">' + cov + '</span></div>';
    h += '<div class="drow"><span class="dk">Verdict</span><span class="dv">' + (r.verdict ? r.verdict + ' recorded ' + fmtT(sAct(r,4)) : '<span class="mutedc">none</span>') + '</span></div>';
    h += '<div class="drow"><span class="dk">Digest</span><span class="dv">' + (r.verdict ? 'd-22' + r.nn + ' posted ' + fmtT(sAct(r,5)) : '<span class="mutedc">none</span>') + '</span></div>';
  }
  h += '</div>';

  h += '</div></div>';
  $id('schedrow').innerHTML = h;
}
function schedStrip(){
  switch(state.schedDetail){
    case 'cadence':{
      var held = state.suspended ? '4 held' : '4 to come';
      return '16 cycles booked hourly · 10 closed · 1 struck · 1 live · ' + held;
    }
    case 'late':
      return 'strike threshold ' + esc(state.so[1].val) + ' · worst today +21 '
        + '<button class="runchip" data-act="rescope" data-run="r-2209" title="rescope to r-2209">r-2209 ▸</button>';
    case 'clock': return 'all times farm local (UTC−05) · scheduler holds the book, cycles hold their hour';
  }
  return '';
}
function dataStrip(){
  switch(state.dataDetail){
    case 'archive': return 'oldest run Mar 03 2026 · covers through r-2211 closed 16:41 · verified nightly';
    case 'backfill': return 'repair Aug 19 — 2 lineages rewritten from digest copies · 0 owed since';
    case 'snap': return 'write 2 after checksum fail 17:15 — verified 17:15:09 · on the :15 after each open';
  }
  return '';
}

/* ---------- render: log ---------- */
function renderLog(){
  var r = scopeRun();
  var rows = state.log.filter(function(row){ return !r || row.run===r.id; });
  var h = '<div class="panel"><div class="panel-head"><span class="label">Log</span>'
    + '<span class="legend">incidents · owner orders — minutes lost ' + lostTotal() + ' of 960</span></div>';
  if (!rows.length){
    h += '<div class="pempty">No incidents — clean cycle.</div>';
  }
  rows.forEach(function(row){
    var right = row.kind==='order'
      ? '<span class="erik">' + row.who + '</span>'
      : row.lost + ' min';
    var chip = (row.run && (!r)) ? '<button class="runchip" data-act="rescope" data-run="' + row.run + '" title="rescope to ' + row.run + '">' + row.run + ' ▸</button>' : '';
    h += '<div class="lrow' + (row.fresh?' fresh':'') + '"><span class="lt">' + row.t + '</span>'
      +  '<span class="ltx">' + esc(row.text) + chip + '</span>'
      +  '<span class="lright">' + right + '</span></div>';
    row.fresh = false;
  });
  if (r){
    h += '<div class="logfoot">' + state.log.length + ' rows on the day book — <button data-act="day">Day ▸</button></div>';
  }
  h += '</div>';
  $id('logblock').innerHTML = h;
}

/* ---------- render: helm ---------- */
function renderHelm(){
  var h = '<div class="panel"><div class="panel-head"><span class="label">Helm</span>'
    + '<span class="legend">standing orders · control — every order lands in the log</span></div>';

  h += '<div class="so"><div class="so-lab"><span class="label">Standing orders</span></div>';
  state.so.forEach(function(o){
    h += '<div class="so-cell"><span class="so-k">' + o.label + '</span>';
    if (state.soEdit===o.key){
      h += '<span class="so-edit"><input id="so-input" value="' + esc(state.soVal!==undefined?state.soVal:o.val) + '">'
        +  '<button class="mini" data-act="so-set" data-key="' + o.key + '" title="set — appends an order">✓</button>'
        +  '<button class="mini" data-act="so-cancel" title="cancel">✕</button></span>';
    } else {
      h += '<div class="so-v">' + esc(o.val)
        +  '<button class="pencil" data-act="so-edit" data-key="' + o.key + '" title="edit standing order — appends an order">✎</button></div>'
        +  '<div class="so-p">' + esc(o.prov) + '</div>';
    }
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="ctl">';
  if (state.suspended){
    h += '<button class="suspend resume" data-act="resume" title="resume generation — appends an order">Resume generation</button>'
      +  '<span class="conseq">Cycles 13–16 held · resume reopens next booked hour · nothing else changes.</span>';
  } else if (state.armed){
    h += '<button class="suspend confirm" data-act="suspend-confirm" title="confirm — appends an order">Confirm suspend</button>'
      +  '<button class="keep" data-act="suspend-cancel">Keep running</button>'
      +  '<span class="conseq">Confirms: cycle 12 finishes to 17:41 · cycles 13–16 do not open.</span>';
  } else {
    h += '<button class="suspend" data-act="suspend">Suspend generation</button>'
      +  '<span class="conseq">Cycle 12 runs to 17:41 · 13–16 do not open · resume reopens next booked hour.</span>';
  }
  h += '</div></div>';
  $id('helm').innerHTML = h;
}

/* ---------- render all ---------- */
function stashInputs(){
  var t = $id('cf-topic'); if (t) state.cfTopic = t.value;
  var c = $id('cf-cycles'); if (c) state.cfCycles = c.value;
  var s = $id('so-input'); if (s) state.soVal = s.value;
}
function renderAll(){
  renderCourse(); renderCrumb(); renderLede(); renderLedger();
  renderTimetable(); renderVolumes(); renderPapers(); renderSched();
  renderLog(); renderHelm();
}

/* ---------- actions ---------- */
function rescope(id){
  state.scope = id;
  state.svcDetail = null; state.volDetail = null; state.paperOpen = null;
  state.schedDetail = null; state.dataDetail = null;
  state.allotEdit = null;
  renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  stashInputs();
  switch(act){
    case 'rescope': rescope(el.getAttribute('data-run')); break;
    case 'day': rescope('day'); break;
    case 'svc': {
      var v = el.getAttribute('data-svc');
      var key = v==='day' ? 'day' : parseInt(v,10);
      state.svcDetail = (state.svcDetail===key) ? null : key;
      renderAll(); break;
    }
    case 'vol': {
      var vi = parseInt(el.getAttribute('data-vol'),10);
      var r = scopeRun();
      if (r && VOLS[vi].k==='papers' && r.papers.length){
        state.volDetail = null; renderAll();
        var p = $id('paperspanel');
        if (p){ p.scrollIntoView({behavior:'smooth', block:'center'}); p.classList.add('pulse'); }
      } else {
        state.volDetail = (state.volDetail===vi) ? null : vi;
        renderAll();
      }
      break;
    }
    case 'paper': {
      var pi = parseInt(el.getAttribute('data-i'),10);
      state.paperOpen = (state.paperOpen===pi) ? null : pi;
      renderPapers(); break;
    }
    case 'sched': {
      var sk = el.getAttribute('data-key');
      if (sk==='next' && !state.suspended){ rescope('r-2213'); break; }
      state.schedDetail = (state.schedDetail===sk) ? null : sk;
      renderSched(); break;
    }
    case 'data': {
      var dk = el.getAttribute('data-key');
      state.dataDetail = (state.dataDetail===dk) ? null : dk;
      renderSched(); break;
    }
    case 'course-open': state.courseOpen = true; state.cfTopic=''; state.cfCycles='25–36'; renderCourse(); var ct=$id('cf-topic'); if(ct) ct.focus(); break;
    case 'course-cancel': state.courseOpen = false; renderCourse(); break;
    case 'course-set': {
      var topic = (state.cfTopic||'').trim();
      var cyc = (state.cfCycles||'').trim() || '25–36';
      if (!topic){ var tin=$id('cf-topic'); if(tin){ tin.classList.add('bad'); tin.focus(); } break; }
      var rng = parseCycles(cyc);
      state.courses.push({topic:topic, cycles:cyc, from:rng.from, to:rng.to, at:clockHM(), by:'Erik'});
      addOrder('course set: ' + topic + ' × cycles ' + cyc);
      state.courseOpen = false; state.cfTopic='';
      renderAll(); break;
    }
    case 'allot-edit': {
      var ai = parseInt(el.getAttribute('data-svc'),10);
      state.allotEdit = {i:ai, val:state.allots[ai]};
      renderLedger(); break;
    }
    case 'allot-inc': if (state.allotEdit){ state.allotEdit.val = Math.min(500, state.allotEdit.val+5); renderLedger(); } break;
    case 'allot-dec': if (state.allotEdit){ state.allotEdit.val = Math.max(5, state.allotEdit.val-5); renderLedger(); } break;
    case 'allot-cancel': state.allotEdit = null; renderLedger(); break;
    case 'allot-set': {
      if (!state.allotEdit) break;
      var ii = state.allotEdit.i, nv = state.allotEdit.val, ov = state.allots[ii];
      state.allotEdit = null;
      if (nv!==ov){
        state.allots[ii] = nv;
        addOrder(SVC[ii].name + ' allot set $' + ov + ' → $' + nv);
      }
      renderAll(); break;
    }
    case 'so-edit': {
      state.soEdit = el.getAttribute('data-key'); state.soVal = undefined;
      renderHelm(); var si=$id('so-input'); if(si){ si.focus(); si.select(); } break;
    }
    case 'so-cancel': state.soEdit = null; state.soVal = undefined; renderHelm(); break;
    case 'so-set': {
      var sk2 = el.getAttribute('data-key');
      var so = state.so.filter(function(o){return o.key===sk2;})[0];
      var input = $id('so-input');
      var nv2 = input ? input.value.trim() : '';
      state.soEdit = null; state.soVal = undefined;
      if (so && nv2 && nv2!==so.val){
        so.val = nv2; so.prov = 'set ' + clockHM() + ' by Erik';
        addOrder('standing order — ' + so.label.toLowerCase() + ' ' + nv2);
      }
      renderAll(); break;
    }
    case 'suspend': state.armed = true; renderHelm(); break;
    case 'suspend-cancel': state.armed = false; renderHelm(); break;
    case 'suspend-confirm':
      state.armed = false; state.suspended = true;
      addOrder('generation suspended — cycles 13–16 held on book');
      renderAll(); break;
    case 'resume':
      state.suspended = false;
      addOrder('generation resumed — cycle 13 reopens 18:00:00');
      renderAll(); break;
    case 'rerun': {
      var rr = el.getAttribute('data-run');
      if (!state.requeued[rr]){
        state.requeued[rr] = true;
        addOrder('re-run ' + rr + ' queued after live cycle');
      }
      renderAll(); break;
    }
  }
});
document.addEventListener('keydown', function(e){
  if (e.key!=='Escape') return;
  if (state.allotEdit){ state.allotEdit=null; renderLedger(); return; }
  if (state.soEdit){ state.soEdit=null; state.soVal=undefined; renderHelm(); return; }
  if (state.courseOpen){ state.courseOpen=false; renderCourse(); return; }
  if (state.armed){ state.armed=false; renderHelm(); return; }
  if (state.svcDetail!==null || state.volDetail!==null || state.schedDetail || state.dataDetail){
    state.svcDetail=null; state.volDetail=null; state.schedDetail=null; state.dataDetail=null;
    renderAll(); return;
  }
  if (state.scope!=='day') rescope('day');
});

/* ---------- clock ---------- */
function tick(){
  clockSec++;
  var s = clockSec, hh = Math.floor(s/3600)%24, mm = Math.floor(s/60)%60, ss = s%60;
  var c = $id('clock');
  if (c) c.textContent = pad2(hh) + ':' + pad2(mm) + ':' + pad2(ss);
}

/* ---------- init ---------- */
if (typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById('crumb')){
  renderAll();
  setInterval(tick, 1000);
}
