  transcribe:
    description: Source-to-transcript ingestion pipeline (YouTube URLs, authenticated downloads, Whisper API + local Whisper + caption fallbacks, batch, cost preflight, structured JSON)
    capabilities:
    - transcribe YouTube videos by URL or ID (public and members-only)
    - transcribe local audio/video files
    - use authenticated agent-do browse sessions for members-only content
    - pass yt-dlp extractor args and YouTube player-client overrides when cookies alone are insufficient
    - capture authenticated browser tab audio for member-tier/paywalled media that yt-dlp cannot extract
    - call OpenAI Whisper API with automatic ffmpeg chunking for large audio
    - fall back to local Whisper, YouTube auto-captions, or yt-dlp VTT subtitles
    - batch transcribe from stdin or a file of URLs
    - estimate API cost before committing (preflight, never blocks)
    - cache results per source/method to skip repeat work
    commands:
      doctor: Report dependency, credential, and browse-session readiness
      snapshot: Report cache state, available browse sessions, default method order
      cost: Estimate Whisper API cost for one source or a batch (informational preflight)
      transcribe: Transcribe a source to text+JSON (default verb when first arg is a URL/ID/path)
    examples:
    - intent: transcribe a public YouTube video
      command: agent-do transcribe https://youtube.com/watch?v=dQw4w9WgXcQ
    - intent: transcribe a members-only YouTube video using saved auth
      command: agent-do transcribe https://youtube.com/watch?v=XXX --browse-session youtube_arc
    - intent: retry a members-only YouTube video through a mobile player client
      command: agent-do transcribe https://youtube.com/watch?v=XXX --browse-session youtube_arc --youtube-player-client ios
    - intent: transcribe browser-only member-tier YouTube content
      command: agent-do transcribe https://youtube.com/watch?v=XXX --browse-session youtube_arc --browser-capture --json
    - intent: estimate cost for a batch before transcribing
      command: agent-do transcribe cost --batch-file urls.txt --youtube-player-client ios --json
    - intent: batch transcribe with structured output
      command: agent-do transcribe --batch-file urls.txt --browse-session youtube_arc --browser-capture --output-dir ./transcripts --json
    - intent: free fallback only (no Whisper API)
      command: agent-do transcribe <url> --prefer-free
    - intent: check tool readiness as JSON
      command: agent-do transcribe doctor --json
    routing:
      discover_keywords:
      - transcribe
      - transcription
      - youtube transcript
      - video transcript
      - audio transcript
      - speech to text
      - whisper
      - caption
      - subtitle
      - yt-dlp
      - youtube player client
      - extractor args
      - browser capture
      - tab audio
      prompt_patterns:
      - \btranscrib\w*\b
      - \btranscript\b
      - \byoutube.*(transcript|caption|subtitle|transcribe)\b
      - \b(speech|audio|video).*to.*text\b
      - \bwhisper\s+api\b
      - \bcaption\w*\b
      - \bplayer_client\b
      - \bextractor args?\b
      - \bbrowser capture\b
      - \btab audio\b
      recommended_entrypoints:
      - agent-do transcribe doctor --json
      - agent-do transcribe cost <url> --youtube-player-client ios --json
      - agent-do transcribe <url> --browse-session youtube_arc --browser-capture --json
      - agent-do transcribe <url> --browse-session youtube_arc --youtube-player-client ios --json
      - agent-do transcribe --batch-file urls.txt --browse-session youtube_arc --browser-capture --output-dir transcripts --json
      default_command: doctor
    credentials:
      optional:
      - OPENAI_API_KEY
    contracts:
      connect:
      - doctor
      snapshot:
      - snapshot
      - cost
      interact:
      - transcribe
      verify:
      - doctor
      - cost
      save:
      - transcribe
      attributes:
        doctor: [composite]
        cost: [composite]
        transcribe: [composite, long_running]
    concurrency: mixed
