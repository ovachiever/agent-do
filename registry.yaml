      features:
        NOTION_TOKEN:
          unlocks: Notion workspace read/write, comments, data sources, cache sync, schema bootstrap, and verified team saves
          required_for:
          - doctor
          - snapshot
          - read
          - search
          - save
          - sync
          - bootstrap-team
          recommended: true
          setup: agent-do creds store NOTION_TOKEN --stdin
        VOYAGE_API_KEY:
          unlocks: optional semantic cache embeddings for Notion pages and blocks
          required_for:
