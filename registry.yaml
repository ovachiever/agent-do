tools:
  brief:
    description: Estate briefing engine — joins GitHub PRs, the manna board, live coord sessions,
      and git into ranked threads, a delta since last look, one-tap suggestions carried as data,
      and a receipts-grounded paragraph
    capabilities:
    - join gh inbox rows to manna items to live coord sessions to last commits to claim state
    - rank threads with reasons that explain every score (heuristic today, learned as the behavior journal fills)
    - compute the delta since the caller's last look (explicit --since, read-state, or first look)
    - carry manna reconcile desyncs as one-tap suggestions whose commands are data, never executed
    - speak a paragraph grounded in receipts (model voice when configured; deterministic fallback, annotated)
    - answer estate questions with a receipt id on every claim
    - versioned full-shape JSON contract for the Holy panel; consumers fail closed on drift
    - pin, snooze (until a timestamp or until the thread changes), record observed behavior
    - honest degradation — a failed source is an annotation, never a guess and never silence
    commands:
      now: Human-readable estate brief; model voice when configured, deterministic sentence annotated otherwise
      threads: Joined thread objects — gh PR ↔ manna item ↔ live session ↔ last commit ↔ claim state
      ask: Answer a question over the estate (sessions, git log, board, zpc); every claim carries a receipt id
      holy: Full composite contract JSON for the Holy panel — versioned, full shape, honest degradations
      pin: Pin a thread (rank boost, survives restarts)
      unpin: Remove a pin
      snooze: Snooze a thread until a timestamp or until it changes (refuses an unbounded snooze)
      unsnooze: Clear a snooze
      observe: Record observed behavior on a thread (acted|ignored|snoozed|pinned|opened) — feeds the ranker
      state: Show the read-state store and journal size
    examples:
    - intent: what needs me right now
      command: agent-brief now
    - intent: full contract for the Holy panel
      command: agent-brief holy --focused-repo ~/Custom-Coding/holy-ghostty --since 2026-08-11T14:00:00Z
    - intent: joined threads as data
      command: agent-brief threads --json
    - intent: ask the estate a question
      command: agent-brief ask "who touched the auth flow last week"
    - intent: snooze a thread until it changes
      command: agent-brief snooze mn-53da2c --until-changed
    - intent: record that I acted on a thread
      command: agent-brief observe ovachiever/agent-do#23 acted
    routing:
      discover_keywords:
      - brief
      - briefing
      - estate brief
      - what needs me
      - intelligent inbox
      prompt_patterns:
      - '\bbrief\b.*\b(estate|holy|now|threads?)\b'
      - '\bwhat\s+needs\s+me\b'
      - '\bestate\s+brief(ing)?\b'
      recommended_entrypoints:
      - agent-do brief now
      - agent-do brief threads
      - agent-do brief holy --json
      default_command: now
    credentials:
      optional:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
    bounds:
      now: &brief-sweep-bound
        source: measured
        ref: 2 x the sweep's last measured duration (brief's own calibration state); bootstrap 2 x lib/quantities.READ_PROBE_TIMEOUT_SECONDS, the shared read-probe budget
        why: >-
          The GitHub inbox sweep is a network fan-out, not a local probe, so
          the shared probe budget alone starves it (consumer-verified: the
          sweep needs roughly twice the probe budget warm). Factor 2 is the
          hung-detector: slower than twice the known-good pace reads as hung,
          not slow. After one success the budget derives from the sweep's own
          measured duration, held in brief's state; the caller's explicit
          --timeout overrides everything. Local sources keep the probe budget.
      threads: *brief-sweep-bound
      ask: *brief-sweep-bound
      holy: *brief-sweep-bound
    contracts:
      snapshot:
      - now
      - threads
      - ask
      - holy
      - state
      interact:
      - now
      - ask
      save:
      - holy
      - pin
      - unpin
      - snooze
      - unsnooze
      - observe
      attributes:
        now:
        - long_running
        - polymorphic
        threads:
        - long_running
        ask:
        - composite
        - long_running
        holy:
        - composite
        - long_running
        - own_state
        snooze:
        - polymorphic
    concurrency: mixed
  context:
    description: Knowledge library — fetch, index, and serve external reference docs. Complementary to zpc (experience journal).
    capabilities:
    - fetch documentation from markdown/text URLs, HTML pages/sites, llms.txt, or GitHub repos
    - search across all indexed content with FTS5 BM25 + trust-tier ranking
    - retrieve query-specific context with freshness, provenance, trust, and version-currency metadata
    - refresh stale WAN-backed packages with conditional HTTP, ETag/Last-Modified, and last-good cache preservation
    - preserve raw HTML while indexing extracted readable content
    - check package documentation currency against npm, PyPI, crates.io, pub.dev, or GitHub releases
    - serve a local read-only HTML dashboard for agents and humans
    - index local project files and Claude skills
    - token-aware context budgeting for agents (knapsack packing)
    - persistent annotations and feedback-influenced search ranking
    - build and validate private content packages
    - multi-source registry with trust-tier resolution
    - global storage at ~/.agent-do/context/ (per-user, not per-project)
    commands:
      search: Search across all indexed content
      retrieve: 'Return token-budgeted context for agents: retrieve <query> [--fresh|--require-fresh|--require-official|--prefer-latest|--require-current|--offline]'
      get: 'Fetch doc/skill by ID: get <id> [--file F] [--full]'
      list: 'List available packages: list [--source S] [--tags T]'
      fetch: 'Fetch markdown/text or single HTML page from URL: fetch <url> [--register-source]'
      crawl: 'Crawl bounded same-origin HTML docs: crawl <url> [--limit N]'
      fetch-llms: 'Fetch llms.txt from domain: fetch-llms <domain> [--register-source]'
      fetch-repo: 'Fetch docs from GitHub: fetch-repo <owner/repo> [path] [--register-source]'
      refresh: 'Refresh WAN-backed packages: refresh <id|name> | --due | --all'
      scan-local: 'Index project files: scan-local [path]'
      scan-skills: Index ~/.claude/skills/
      sources: 'List/sync configured content sources: sources [sync <name|--all>]'
      add-source: 'Register a source: add-source <name> <url|path> [--kind K] [--trust T] [--ttl 7d] [--ecosystem npm --package name --doc-version latest]'
      remove-source: 'Unregister a source: remove-source <name>'
      cache: 'Cache management: cache [list|clear|pin|stats]'
      annotate: 'Attach note: annotate <id> <note>'
      feedback: 'Rate a package: feedback <id> up|down'
      budget: 'Best content within token limit: budget <tokens> <query>'
      inject: 'Context blob for agents: inject [--max-tokens N]'
      build: 'Package content directory: build <dir> [-o output]'
      validate: 'Check frontmatter + structure: validate <dir>'
      status: Sources, cache stats, index freshness
      stale: Show stale or failed packages
      versions: 'Check/list version currency: versions check [--all|--due|id] | versions outdated'
      serve: 'Serve local context dashboard: serve [--port N]'
      maintain: 'Run bounded maintenance: maintain [--limit N] [--max-mb N]'
      init: Initialize ~/.agent-do/context/
    examples:
    - intent: fetch stripe documentation
      command: agent-context fetch-llms stripe.com
    - intent: search for authentication docs
      command: agent-context search authentication
    - intent: retrieve fresh context for latest auth docs
      command: agent-context retrieve "latest auth docs" --fresh --prefer-latest --max-tokens 8000
    - intent: crawl an HTML docs site
      command: agent-context crawl https://docs.example.com --limit 25
    - intent: get the supabase docs
      command: agent-context get supabase-llms
    - intent: what docs do I have
      command: agent-context list
    - intent: give me 4000 tokens of react context
      command: agent-context budget 4000 react
    - intent: index my claude skills
      command: agent-context scan-skills
    - intent: fetch docs from a github repo
      command: agent-context fetch-repo vercel/next.js docs/ --register-source
    - intent: keep docs fresh
      command: agent-context maintain --limit 10
    - intent: show outdated docs
      command: agent-context versions outdated
    - intent: sync configured docs sources
      command: agent-context sources sync --all
    - intent: add a note to a doc
      command: agent-context annotate stripe-llms 'Use idempotency keys for POST'
    routing:
      discover_keywords:
      - docs
      - documentation
      - llms.txt
      - reference docs
      - knowledge library
      - indexed content
      prompt_patterns:
      - \bdocs?\b
      - \bdocumentation\b
      - \bllms\.txt\b
      - \breference docs?\b
      - \bknowledge library\b
      recommended_entrypoints:
      - agent-do context retrieve "<query>" --fresh --prefer-latest --max-tokens 8000
      - agent-do context sources sync --all
      - agent-do context maintain --limit 10
      - agent-do context fetch-llms stripe.com
      default_command: retrieve
      project_signals:
      - docs
      - knowledge
      readiness:
        check: agent-do context status
        fix: agent-do context init
        note: Global context storage may need initialization
    contracts:
      connect:
      - init
      snapshot:
      - search
      - retrieve
      - get
      - list
      - sources
      - cache list
      - cache stats
      - budget
      - inject
      - status
      - stale
      - versions
      interact:
      - retrieve
      - fetch
      - crawl
      - fetch-llms
      - fetch-repo
      - refresh
      - scan-local
      - scan-skills
      - add-source
      - remove-source
      - cache clear
      - cache pin
      - build
      - maintain
      verify:
      - validate
      save:
      - crawl
      - annotate
      - feedback
      attributes:
        retrieve:
        - polymorphic
        crawl:
        - composite
        remove-source:
        - destructive
        cache clear:
        - destructive
        serve:
        - long_running
        maintain:
        - composite
        - destructive
    bounds:
      retrieve:
        source: none
        why: >-
          --max-tokens is the caller's knob and 8000 is its default
          (lib/retrieve.sh). The set it draws from is the local document index,
          not a model window, so no published ceiling governs the number. Held
          instead to disclosure: the returned context must say how much of the
          matching corpus it carried.
      inject:
        source: none
        why: >-
          Same knob, same default, at lib/budget.sh:176. A budget the caller
          chooses is not a ceiling somebody published, so there is nothing to
          cite; what it owes is a total beside the blob.
      init:
        source: none
        why: >-
          Writes 8000 as defaults.max_tokens into the generated config so a
          fresh install and a fresh call agree on the same caller-facing
          default. It mirrors the retrieval knob rather than deriving from any
          ceiling.
    concurrency: mixed
  creds:
    description: Secure credential storage and resolution for agent-do tools
    capabilities:
    - store secrets in the OS secure credential store
    - resolve tool credentials from env vars or secure storage
    - check which credentials a tool needs
    - export resolved credentials for debugging
    - list and delete stored secrets
    commands:
      store: 'Store a secret: store <KEY> [VALUE] [--stdin]'
      get: 'Show secret status: get <KEY> [--reveal|--source]'
      delete: 'Delete a secret: delete <KEY>'
      list: List stored secret keys
      check: 'Check secrets: check <KEY...> | --tool <tool>'
      required: 'Show declared tool credentials: required <tool>'
      export: 'Print export lines: export <KEY...> | --tool <tool>'
      platform: Show detected secure-store backend
    examples:
    - intent: store a render API key securely
      command: agent-creds store RENDER_API_KEY --stdin
    - intent: check what namecheap needs
      command: agent-creds required namecheap
    - intent: verify vercel credentials
      command: agent-creds check --tool vercel
    routing:
      discover_keywords:
      - credentials
      - api key
      - access token
      - secret key
      - env var
      - keychain
      prompt_patterns:
      - \bcredentials?\b
      - \bapi key\b
      - \baccess token\b
      - \bsecret key\b
      - \bkeychain\b
      recommended_entrypoints:
      - agent-do creds check --tool <tool>
      - agent-do creds required <tool>
      - agent-do creds store <ENV_VAR> --stdin
      default_command: check
      raw_cli_equivalents:
      - pattern: \bsecurity\s+add-generic-password\b
        replacement: agent-do creds
        example: agent-do creds store RENDER_API_KEY --stdin
        reason: agent-do creds uses the same secure store without requiring raw keychain commands
      - pattern: \bexport\s+[A-Z0-9_]*(TOKEN|API_KEY|SECRET|ACCESS_TOKEN)=
        replacement: agent-do creds
        example: agent-do creds store RENDER_API_KEY --stdin
        reason: agent-do creds keeps secrets out of shell history and centralizes resolution
    contracts:
      snapshot:
      - get
      - list
      - required
      - platform
      interact:
      - delete
      verify:
      - check
      save:
      - store
      - export
      attributes:
        store:
        - sensitive
        delete:
        - destructive
        - sensitive
    concurrency: mixed
  auth:
    description: Site-level authentication orchestration over encrypted session bundles, browser import, and secure credentials
    capabilities:
    - create site auth profiles with validation rules and strategy ladders
    - reuse saved authenticated browser state before trying fresh login
    - import cookies and storage from a real authenticated browser profile
    - drive provider-aware site login with secrets resolved from env or agent-do creds
    - handle GitHub and Google login shapes before falling back to generic form fill
    - resolve TOTP secrets from agent-do creds when login flows require one-time codes
    - consume provider backup codes from secure storage when recovery-code branches appear
    - wait for mailbox-delivered verification codes or magic links through agent-do email
    - wait for SMS-delivered verification codes or magic links through agent-do sms
    - validate whether saved authenticated state is still usable
    - inspect the live auth branch and classify checkpoints before retrying
    - return next-step auth guidance for agents
    - reuse upstream GitHub or Google auth to complete SSO into another site
    - inherit upstream GitHub or Google TOTP and backup-code config when a provider-backed site hits those checkpoints
    - step through provider account choosers and consent screens with persisted checkpoint metadata
    - surface passkey or security-key checkpoints as explicit action-required states
    - open a real system browser for anti-bot or remote human-visible login flows, then import validated state back into auth storage
    commands:
      init: 'Initialize a site profile: init <site> [--domain D] [--login-url URL] [--provider generic|github|google] [--email-code|--magic-link|--sms-code|--sms-link]'
      list: 'List configured auth profiles: list'
      show: 'Show one auth profile: show <site>'
      status: 'Show auth state: status <site> [--name default]'
      probe: 'Inspect the current auth checkpoint branch: probe <site> [--load]'
      advance: 'Advance one safe checkpoint step and re-probe, preferring visible in-browser alternate methods: advance <site> [--action ACTION] [--timeout 60]'
      ensure: 'Run the strategy ladder: ensure <site> [--strategy saved-session|browser-import|site-creds|provider-refresh|interactive] [--timeout 180]'
      save: 'Save current authenticated browser state: save <site> [--name default]'
      load: 'Load saved browser auth state: load <site> [--name default]'
      import-browser: 'Import cookies and browser storage from a real browser: import-browser <site> [--browser comet] [--domain .example.com] (cookies, local/session storage, and best-effort IndexedDB)'
      clear: 'Clear saved auth state: clear <site> [--all]'
      validate: 'Validate signed-in state: validate <site>'
      instructions: 'Next-step guidance: instructions <site>'
    examples:
    - intent: create a github auth profile
      command: agent-auth init github
    - intent: create a github sso profile for another site
      command: agent-auth init widgethub --domain app.example.com --provider github
    - intent: reuse saved github auth
      command: agent-auth ensure github
    - intent: reuse github auth to sign into another app
      command: agent-auth ensure widgethub --strategy provider-refresh
    - intent: open the real browser for a cloudflare login and import the authenticated state
      command: agent-auth ensure cloudflare --strategy interactive --timeout 300
    - intent: initialize a site that sends email verification codes
      command: agent-auth init widgethub --domain app.example.com --email-code --email-from WidgetHub --email-subject "verification code" --email-account Work --email-mailbox Inbox
    - intent: initialize a site that texts verification codes
      command: agent-auth init widgethub --domain app.example.com --sms-code --sms-from WidgetHub --sms-contains "verification"
    - intent: log into github with saved creds and totp
      command: agent-auth ensure github --strategy site-creds
    - intent: log into google with saved creds and totp
      command: agent-auth ensure google --strategy site-creds
    - intent: import cookies from comet for github
      command: agent-auth import-browser github --browser comet --domain .github.com
    - intent: check if we are still signed in
      command: agent-auth validate github
    - intent: inspect auth state for a site
      command: agent-auth status github
    - intent: inspect the current auth checkpoint
      command: agent-auth probe github
    - intent: advance a live auth checkpoint
      command: agent-auth advance github
    routing:
      discover_keywords:
      - auth session
      - login state
      - auth checkpoint
      - auth advance
      - passkey prompt
      - recovery code
      - backup code
      - device approval
      - approve sign in
      - choose an account
      - consent screen
      - signed in
      - sso reuse
      - browser cookies
      - github auth
      - google auth
      prompt_patterns:
      - \blog into this site\b
      - \b(auth|login) checkpoint\b
      - \badvance (the )?(auth|login)\b
      - \bpasskey\b
      - \bcheck your phone\b
      - \bchoose an account\b
      - \bconsent screen\b
      - \breuse .* auth\b
      - \b(load|reuse) the saved .* session\b
      - \bcheck if (we|i) (am|are) signed in\b
      - \bimport cookies from\b
      - \bsso\b
      recommended_entrypoints:
      - agent-do auth ensure <site>
      - agent-do auth probe <site>
      - agent-do auth advance <site>
      - agent-do auth status <site>
      - agent-do auth validate <site>
      default_command: list
      project_signals:
      - auth
      - login
      - sso
      - oauth
      - identity
    contracts:
      connect:
      - init
      - ensure
      - load
      - import-browser
      snapshot:
      - list
      - show
      - status
      - probe
      - instructions
      interact:
      - advance
      - clear
      verify:
      - import-browser
      - validate
      save:
      - save
      - import-browser
      attributes:
        probe:
        - composite
        advance:
        - composite
        ensure:
        - composite
        - long_running
        import-browser:
        - composite
        - sensitive
        clear:
        - destructive
    concurrency: mixed
  spec:
    description: Repo-local specifications and change artifacts for intended behavior, change deltas, and archive readiness
    capabilities:
    - initialize repo-local spec storage under agent-do-spec/
    - create structured change packages with proposal, design, tasks, and deltas
    - list canonical specs, active changes, and archived changes
    - show one spec or one change package in human or JSON form
    - derive change status from repo files instead of hidden state
    commands:
      init: 'Initialize storage: init [--force]'
      list: 'List specs or changes: list [--specs|--changes|--archived]'
      show: 'Show one spec or change: show <name> [--type spec|change]'
      new: 'Create a change package: new <change-id> [--title T] [--spec S]'
      status: 'Summarize progress: status [--change <id>]'
    examples:
    - intent: initialize repo-local specs
      command: agent-spec init
    - intent: create a new change proposal
      command: agent-spec new add-oauth-device-flow --spec auth
    - intent: show what changes exist
      command: agent-spec list --changes
    - intent: inspect one change package
      command: agent-spec show add-oauth-device-flow --type change
    - intent: see what artifacts are missing before implementation
      command: agent-spec status --change add-oauth-device-flow
    routing:
      discover_keywords:
      - change proposal
      - behavior spec
      - spec package
      - change delta
      - archive readiness
      - implementation artifacts
      prompt_patterns:
      - \bwrite a spec\b
      - \bspec (this|that|the) (feature|change)\b
      - \bchange proposal\b
      - \bpropose this change\b
      - \bartifacts? (are )?missing before implementation\b
      - \barchive this completed change\b
      recommended_entrypoints:
      - agent-do spec list
      - agent-do spec new <change-id>
      - agent-do spec status --change <change-id>
      default_command: list
      project_signals:
      - spec
      - planning
      - docs
    contracts:
      connect:
      - init
      snapshot:
      - list
      - show
      - status
      interact:
      - new
    concurrency: mixed
  zpc:
    description: Experience journal — structured lessons, decisions, patterns per project. Complementary to context (knowledge
      library).
    capabilities:
    - capture structured lessons (context/problem/solution/takeaway)
    - log architectural decisions with options, rationale, confidence
    - hold positions with a falsifier and refuse evidence-free flips
    - name every claim with a content-derived id (les-/dec-) and retract it with evidence
    - inject memory as dated claims that live observation outranks, never as standing law
    - carry the user's recorded preferences into any directory, store or no store
    - re-litigate the most-exposed claims against current code and file challenges on divergence
    - clean-context second opinion on a receipts-only brief
    - consolidate lessons into patterns via harvest
    - inject memory context into AI agents
    - search and query memory by tag, date, or text
    - git history review for post-sprint lesson extraction
    - swarm checkpoints for multi-agent phase boundary compliance
    - lesson promotion (local → team → global)
    - per-project storage at .zpc/ (not global)
    commands:
      learn: Capture a structured lesson
      decide: Log a decision with rationale
      decide-batch: Batch-log decisions from planning phase
      retract: Correct a wrong lesson or decision with named evidence (append-only tombstone; --candidate
        files a challenge instead, --backfill assigns derived ids)
      position: Record a verdict with its falsifier; flip it only with named evidence (an evidence-free
        flip also fires a detached second opinion)
      counsel: Clean-context second opinion on a receipts-only brief; --auto-brief assembles the receipts
        mechanically from git and the newest run log
      harvest: Post-build consolidation scan
      query: Search project lessons and decisions; add --global for machine-wide lessons
      patterns: View and score patterns
      review: Post-sprint lesson extraction from git history
      promote: 'Promote lessons: --to team copies rows; --to global is gated and refuses (exit 2, nothing
        written) unless the one row carries --rule, --why, --when kind:match (prompt|command|path|always)
        and --seen-in a,b | --scope machine|user; machine-written rows never qualify; re-promoting
        updates the global copy in place'
      inject: Emit agent context blob (claims rendered dated, kinded and retractable, never as law);
        fits itself to a budget derived from the quantity authority and states the magnitude of
        anything it drops, or takes the caller's own with --max-tokens;
        --trigger prompt|command|path <value> emits only the machine-wide lessons whose `when` fires for that moment
        (the hook path; empty when nothing matches; session start carries `always` rows and a count of the rest);
        --compact carries patterns and claims alone for pasting into a subagent's prompt; --preferences emits only the
        machine-wide preference slice and needs no .zpc store, so what the user already said about
        working follows them into any directory; --relitigate re-tries the most-exposed
        claims against current code in a detached counsel pass (AGENT_DO_ZPC_RELITIGATE=0 disables)
      init: Initialize .zpc/ in a project; --store-only creates the store alone (no .gitignore
        append, no agent instruction file) and keeps it out of git through .git/info/exclude,
        which is what an unattended caller may run in a repo it does not own
      status: Memory snapshot with health check
      checkpoint: Swarm phase boundary check
      profile: View/update project profile
    examples:
    - intent: log a lesson about mypy
      command: agent-zpc learn 'type checking' 'mypy missed Optional' 'added strict mode' 'always use --strict' --tags mypy,typing
    - intent: what decisions have we made
      command: agent-zpc query --type decisions
    - intent: batch log planning decisions
      command: echo 'Color | oklch dark | perceptual' | agent-zpc decide-batch --tags design
    - intent: check swarm phase boundary
      command: agent-zpc checkpoint --phase 'Phase 2' --agents 'agent-a,agent-b'
    - intent: review sprint and extract lessons from git
      command: agent-zpc review --since HEAD~20 --dry-run
    - intent: auto-extract lessons from recent work
      command: agent-zpc review --auto --phase 'Sprint 3'
    - intent: consolidate after swarm build
      command: agent-zpc harvest
    - intent: what has this user already told me about how to work
      command: agent-zpc inject --preferences
    - intent: make a project lesson machine-wide with its rule, why and trigger
      command: agent-zpc promote 14 --to global --rule 'Prove the premise inside the test' --why 'a faked
        premise proves nothing' --when 'path:test_*.py' --scope user
    - intent: which machine-wide lessons fire for this moment
      command: agent-zpc inject --trigger prompt 'write a test for the parser'
    - intent: check memory status
      command: agent-zpc status
    - intent: search for docker lessons
      command: agent-zpc query --tag docker
    - intent: set up zpc in this project
      command: agent-zpc init
    - intent: correct a lesson that turned out to be wrong
      command: agent-zpc retract les-1a2b3c --evidence 'src/api.ts:44 sets Retry-After on every 429' --takeaway
        'the API does send Retry-After'
    - intent: file doubt about a lesson without arguing it
      command: agent-zpc retract --candidate les-1a2b3c --evidence 'no such handler in src/ today'
    - intent: record a position I can be wrong about
      command: agent-zpc position add 'the proxy corrupts the payload' --verdict 'double content-encoding' --confidence
        med --falsifier 'byte-identical body across the hop'
    - intent: get a second opinion that has not seen the argument
      command: agent-zpc counsel --brief .dev/receipts.md --question 'Did the payload survive the hop?'
    - intent: second opinion without hand-picking the receipts
      command: agent-zpc counsel --auto-brief --question 'Does the working tree do what the commit message
        claims?'
    - intent: memory blob small enough to paste into a subagent prompt
      command: agent-zpc inject --compact
    - intent: re-check the lessons this project keeps repeating
      command: agent-zpc inject --relitigate
