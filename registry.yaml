      command: agent-do coderabbit doctor
    - intent: coderabbit status and auth summary
      command: agent-do coderabbit snapshot --json
    credentials:
      optional:
      - CODERABBIT_API_KEY
      notes:
      - "Free tier (3 reviews/hour): run 'agent-do coderabbit auth login' for browser OAuth. The CodeRabbit CLI saves that login locally, so later reviews work without an API key."
      - "Unlimited reviews: store CODERABBIT_API_KEY with 'agent-do creds store CODERABBIT_API_KEY --stdin'. CodeRabbit CLI 0.7.0 does not read this env var directly for headless review; agent-coderabbit only passes it as --api-key when AGENT_DO_CODERABBIT_ALLOW_ARGV_API_KEY=1 because argv can expose the key while cr is running."
    routing:
      discover_keywords:
      - coderabbit
      - local code review
      - local review
      - pre-pr review
      - cr review
      recommended_entrypoints:
      - agent-do coderabbit review
      - agent-do coderabbit doctor
      default_command: review
      raw_cli_equivalents:
      - pattern: \bcr\b\s+(--agent|--base|--light|--committed|--uncommitted|--include-untracked|--dir|review)
        replacement: agent-do coderabbit
        example: agent-do coderabbit review --base develop
        reason: agent-do coderabbit adds credential management and structured JSON output
      project_signals:
      - .coderabbit.yaml
      - .coderabbit
      readiness:
        check: agent-do coderabbit doctor
        fix: brew install coderabbit && agent-do coderabbit auth login
        note: Free tier requires browser login saved by the CodeRabbit CLI; CODERABBIT_API_KEY is not passed through argv unless AGENT_DO_CODERABBIT_ALLOW_ARGV_API_KEY=1 is set in trusted automation
    contracts:
      connect:
      - doctor
      snapshot:
      - snapshot
      - findings
      interact:
      - review
      save:
      - auth login
      - auth org
    concurrency: mixed
  ci:
    description: Control CI/CD pipelines
    capabilities:
    - trigger builds
    - view status
    - manage pipelines
    commands:
      trigger: Trigger build
      status: View status
      logs: View build logs
      triage: Classify a failed run and draft a triage summary (dry-run)
    examples:
    - intent: trigger deploy pipeline
      command: agent-ci trigger deploy
    - intent: triage a failed CI run
      command: agent-ci triage 12345 --repo owner/repo
    contracts:
      snapshot:
      - status
      - logs
      - triage
      interact:
      - trigger
    concurrency: write
  gh:
    description: GitHub repository, pull request, review, and merge work-state across accessible repos
    capabilities:
    - discover accessible GitHub repositories
    - list actionable pull requests across repos
    - inspect pull request details, diffs, checks, and unresolved review threads
    - classify changed files by review-risk tier (critical/elevated/standard)
    - audit PR review risks and generate fix-oriented engineering review replies
    - surface the built-in review doctrine on every review
    - gate merges on failing checks, unresolved threads, dirty merge state, and missing approval
    - approve, comment, request changes, close/reopen, edit, check out, update branches, mark ready/draft, and merge pull requests
    commands:
      whoami: Show authenticated GitHub user
      repos: List or sync accessible repositories
      inbox: Show actionable PR work across repositories — maintainer-role and declared-portfolio sweeps of open third-party PRs plus review-request ceremony (--ceremony-only skips the sweeps)
      portfolio: Manage the declared portfolio of swept repos — add/remove owner/repo or owner/* patterns, list current declarations
      awaiting: Show open PRs likely awaiting your review by broad review heuristics
      prs: Search pull requests
      pr: Show PR details
      diff: Show PR diff
      threads: Show unresolved PR review threads
      checks: Show PR checks
      review: Summarize a PR for review — state, checks, risk tier, and the review doctrine
      audit: Audit a PR for review risks and generate request-changes-ready reply text
      doctrine: Print the PR review doctrine
      approve: Approve a PR
      request-changes: Request changes on a PR
      comment: Comment on a PR
      close: Close a PR
      reopen: Reopen a PR
      checkout: Check out a PR locally
      edit: Edit PR metadata
      update-branch: Update a PR branch from its base branch
      merge: Merge a PR (gated on checks, threads, merge state, approval; --force to bypass)
      ready: Mark a PR ready for review
      draft: Convert a PR to draft
    examples:
    - intent: show GitHub pull requests that need me
      command: agent-gh inbox
    - intent: show PRs awaiting my review in VID repos
      command: agent-gh awaiting --owner Versova-Intelligence-Division --author ctyrrell-versova
    - intent: deeply review PRs awaiting my review and draft replies
      command: agent-gh awaiting --owner Versova-Intelligence-Division --author ctyrrell-versova --audit --replies --probe-deploys
    - intent: list open PRs across my repos
      command: agent-gh prs --state open
    - intent: audit a pull request and generate a request-changes reply
      command: agent-gh audit ovachiever/agent-do#3 --reply --probe-deploys
    - intent: review pull request 3 in agent-do
      command: agent-gh review ovachiever/agent-do#3 --summary
    - intent: show unresolved GitHub review comments
      command: agent-gh threads ovachiever/agent-do#3
    - intent: approve this GitHub PR
      command: agent-gh approve ovachiever/agent-do#3 --body "LGTM"
    - intent: close accidental pull request and delete branch
      command: agent-gh close ovachiever/agent-do#4 --delete-branch --comment "Closing accidental PR"
    - intent: check out pull request for local review
      command: agent-gh checkout ovachiever/agent-do#5 --branch review/pr-5
    - intent: add reviewer and label to pull request
      command: agent-gh edit ovachiever/agent-do#5 --add-reviewer @me --add-label review-needed
    routing:
      default_command: inbox
      recommended_entrypoints:
      - agent-do gh inbox
      - agent-do gh awaiting --owner <owner>
      - agent-do gh awaiting --owner <owner> --audit --replies --probe-deploys
      - agent-do gh prs --state open
      - agent-do gh audit owner/repo#123 --reply --probe-deploys
      - agent-do gh review owner/repo#123 --summary
      discover_keywords:
      - github pull request
      - github pr
      - github code review
      - pr code review
      - pr review
      - review my pr
      - review comments
      - unresolved threads
      - requested review
      - awaiting review
      - waiting for my review
      - approve pr
      - merge pr
      - github inbox
      prompt_patterns:
      - '\b(?:github|gh)\b.*\b(?:pull request|pr|review|merge|approve|checks?)\b'
      - '\b(?:what|which)\s+prs?\s+(?:need|needs|want|wants)\s+me\b'
      - '\bprs?\b.*\b(?:awaiting|waiting)\b.*\b(?:my|me)\b.*\breview\b'
      - '\bunresolved\s+(?:review\s+)?comments?\b'
      raw_cli_equivalents:
      - pattern: '^\s*gh\s+(?:search\s+prs|pr\s+(?:view|diff|checks|review|merge|ready))\b'
        replacement: agent-do gh
        example: agent-do gh inbox
        reason: agent-do gh keeps GitHub PR/review work-state in one structured surface
    contracts:
      snapshot:
      - whoami
      - repos
      - inbox
      - awaiting
      - prs
      - pr
      - diff
      - threads
      - checks
      - review
      - doctrine
      - portfolio list
      interact:
      - approve
      - request-changes
      - comment
      - close
      - reopen
      - checkout
      - edit
      - update-branch
      - merge
      - ready
      - draft
      - portfolio add
      - portfolio remove
      verify:
      - audit
      attributes:
        portfolio add:
        - own_state
        portfolio remove:
        - own_state
    concurrency: mixed
  jira:
    description: Jira issues, sprints, and JQL management
    capabilities:
    - manage saved Jira connection profiles (Cloud and Server/Data Center)
    - view, create, comment on, assign, label, transition, and edit issues
    - search issues with JQL
    - list projects and open issue counts (snapshot)
    - list boards and sprint contents; add issues to sprints
    commands:
      connections: Manage saved connection profiles (add, list, remove, set-default)
      whoami: Show authenticated user info
      snapshot: All projects with open issue counts
      'issue view': View issue details (--comments to include comments)
      'issue list': List issues in a project with JQL filters
      'issue create': Create an issue (--dry-run to preview)
      'issue link': Create a relationship between two issues (--dry-run to preview)
      'issue delete': Delete an issue (--dry-run to preview, --confirm to execute)
      'issue comment': Add a comment to an issue (--dry-run to preview)
      'issue assign': Assign or unassign an issue (--dry-run to preview)
      'issue transition': Move issue to a new status by name (--dry-run to preview)
      'issue label': Add or remove labels on an issue (--dry-run to preview)
      'issue edit': Edit summary, description, or priority (--dry-run to preview)
      transitions: List available workflow transitions for an issue
      'user find': Find Jira users by name, email, or username
      search: Run a raw JQL query
      'board list': List Scrum/Kanban boards
      'sprint list': List sprints for a board
      'sprint active': Show the active sprint and its issues
      'sprint add': Add an issue to a sprint (--dry-run to preview)
    examples:
    - intent: list Jira connection profiles
      command: agent-jira connections list
    - intent: add a Jira Cloud connection
      command: printf '%s\n' "$JIRA_API_TOKEN" | agent-jira connections add work --url https://company.atlassian.net --email me@company.com --token-stdin --default
    - intent: view a Jira issue
      command: agent-jira issue view PROJ-123 --comments
    - intent: list open bugs in a Jira project
      command: agent-jira issue list PROJ --status "In Progress" --type Bug
    - intent: create a Jira issue
      command: agent-jira issue create PROJ --summary "Fix login bug" --type Bug --priority High --dry-run
    - intent: link two Jira issues
      command: agent-jira issue link PROJ-123 --to PROJ-456 --type blocks
    - intent: delete a Jira issue after previewing
      command: agent-jira issue delete PROJ-123 --dry-run
    - intent: move a Jira issue to Done
      command: agent-jira issue transition PROJ-123 --to Done
    - intent: assign a Jira issue
      command: agent-jira issue assign PROJ-123 --to me@company.com
    - intent: find a Jira user account ID
      command: agent-jira user find me@company.com
    - intent: search Jira with JQL
      command: agent-jira search 'assignee = currentUser() AND status != Done ORDER BY priority DESC'
    - intent: show active sprint on a Jira board
      command: agent-jira sprint active 42 --json
    routing:
      default_command: snapshot
      recommended_entrypoints:
      - agent-do jira snapshot
      - agent-do jira issue list <PROJECT-KEY>
      - agent-do jira search '<JQL>'
      discover_keywords:
      - jira
      - jira issue
      - jira ticket
      - jira sprint
      - jira board
      - jira project
      - issue tracker
      - atlassian
      - jql
      prompt_patterns:
      - '\bjira\b'
      - '\b(?:create|view|transition|assign|comment\s+on)\s+(?:a\s+)?(?:jira\s+)?issue\b'
      - '\bJQL\b'
      - '\b(?:sprint|board)\b.*\bjira\b'
      raw_cli_equivalents:
      - pattern: '^\s*(?:curl|http).*atlassian\.net/rest/api'
        replacement: agent-do jira
        example: agent-do jira issue view PROJ-123
        reason: agent-do jira wraps Jira Cloud and Server/DC REST APIs with connection profiles, dry-run, and JSON output
      project_signals:
      - jira
      - jira issue
      - jira ticket
      - jira sprint
      - jira board
      - jira project
      - issue tracker
      - atlassian
      - jql
      readiness:
        check: agent-do jira whoami --json
        fix: printf '%s\n' "$JIRA_API_TOKEN" | agent-do jira connections add work --url https://company.atlassian.net --email me@company.com --token-stdin --default
        note: Requires Jira credentials via env vars or a saved connection profile
    credentials:
      required:
      - JIRA_URL
      - JIRA_EMAIL
      - JIRA_API_TOKEN
      optional:
      - JIRA_SPRINT_FIELD
      notes:
      - Credentials may be saved per-profile in ~/.agent-do/jira/.creds/ (0o600) when using connection profiles; prefer --token-stdin over --token.
      - JIRA_SPRINT_FIELD overrides the site-specific sprint custom field used by issue create --sprint.
    contracts:
      connect:
      - connections add
      - connections remove
      - connections set-default
      snapshot:
      - connections list
      - whoami
      - snapshot
      - issue view
      - issue list
      - transitions
      - user find
      - search
      - board list
      - sprint list
      - sprint active
      interact:
      - issue create
      - issue link
      - issue delete
      - issue comment
      - issue assign
      - issue transition
      - issue label
      - issue edit
      - sprint add
      save:
      - issue create
      - issue link
      - issue delete
      - issue comment
      - issue assign
      - issue transition
      - issue label
      - issue edit
      - sprint add
      attributes:
        connections add:
        - sensitive
        - own_state
        connections remove:
        - own_state
        connections set-default:
        - own_state
        issue delete:
        - destructive
        - composite
        issue create:
        - composite
        issue link:
        - composite
        issue comment:
        - composite
        issue assign:
        - composite
        issue transition:
        - composite
        issue label:
        - composite
        issue edit:
        - composite
        sprint add:
        - composite
    concurrency: mixed
