  obsidian:
    description: Obsidian vault integration with a local SQLite vault index plus official Obsidian CLI fallback
    capabilities:
    - index, read, keyword search, semantic search, hybrid retrieval, query, relate, summarize, and audit local Obsidian vaults
    - build chunked semantic embeddings with Voyage voyage-4-large by default, OpenAI text-embedding-3-large fallback metadata, and Voyage rerank-2.5 reranking when available
    - build cited agent context and GPT-5.5 vault chat answers from local chunks
    - save individual notes and linked note groups with per-vault conventions
    - manage daily, weekly, period, template, graph, tag, backlink, and task workflows
    - read and write YAML frontmatter properties, including batch updates
    - target a specific vault path with --vault or AGENT_OBSIDIAN_VAULT_PATH, or fall back to obsidian-cli for named live vaults
    - emit structured JSON output for every local-index command
    - one-time CLI link from the Obsidian.app bundle into ~/.local/bin
    - +live-gated eval / dev / plugin surface for plugin and theme development
    # concurrency: mixed — read-only: doctor, snapshot, read, search, tasks,
    # tags, backlinks, prop get. Write/state-changing: create, append,
    # daily append, prop set, eval, dev:* (some), plugin reload.
    commands:
      doctor: 'Check obsidian-cli wiring: doctor [--fix] [--json]'
      snapshot: 'Integration state as JSON: snapshot [--vault V]'
      refresh: 'Refresh local SQLite index: refresh [--full] [--json]'
      embed: 'Semantic embedding index: embed status|refresh [--full] [--json]'
      read: 'Read a note: read <name> | --path <path> [--copy] [--vault V]'
      create: 'Create a note: create <name> [--content T] [--template T] [--overwrite] [--open] [--vault V]'
      append: 'Append text to a note: append <name> [<text>...] [--content T] [--path] [--vault V]'
      search: 'Search notes: search <query> [--mode keyword|semantic|hybrid] [--limit N] [--total] [--vault V]'
      context: 'Build cited retrieval context: context build <query> [--mode keyword|semantic|hybrid]'
      chat: 'Answer from vault context with citations: chat <question> [--mode hybrid]'
      connections: 'Find related notes by semantic/hybrid retrieval: connections <name>'
      query: 'Safe DQL subset over local index: query "FROM #tag WHERE status=active SORT due ASC"'
      relate: 'Rank backlink candidates: relate <name-or-content> [--limit N]'
      summarize: 'Summarize matching notes with cited sources: summarize <topic>'
      save: 'Save content with conventions frontmatter: save --content T [--related auto] [--scope local|team|public]'
      save-group: 'Save linked note group: save-group <hub> --child name:body [--scope S]'
      daily: 'Daily notes: daily read | daily append | daily list'
      weekly: 'Weekly notes: weekly read | weekly append | weekly list'
      period: 'Period notes: period read --from YYYY-MM-DD --to YYYY-MM-DD'
      prop: 'Frontmatter properties: prop get|set|list|batch'
      tasks: 'Unified tasks: tasks list|add|complete|update|next'
      tags: 'List or manage tags: tags [--counts] [--sort name|count]'
      backlinks: 'Backlinks for a note: backlinks <name>'
      graph: 'Vault graph: graph orphans|broken-links|clusters|cluster|tag-usage'
      templates: 'Vault templates: templates list|show|apply|register'
      audit: 'Vault hygiene ledger: audit [--scope folder] [--json]'
      move: 'Move note with journaled link rewrite: move <from> <to> [--update-links]'
      delete: 'Move note to .trash: delete <name> --confirm'
      eval: '+live: run JavaScript in Obsidian: eval <code>'
      dev: '+live: developer surface: dev {errors|screenshot|dom|console|css|mobile}'
      plugin: '+live: plugin management: plugin reload <id>'
    examples:
    - intent: check that the obsidian CLI is wired up
      command: agent-do obsidian doctor --json
    - intent: read today's daily note
      command: agent-do obsidian daily read
    - intent: append a task to today's daily note
      command: agent-do obsidian daily append "- [ ] Review PR"
    - intent: create a new note silently
      command: agent-do obsidian create "Inbox/Idea" --content "Pricing experiment"
    - intent: search the active vault
      command: agent-do obsidian search "review" --limit 5
    - intent: build the semantic vault index
      command: agent-do obsidian embed refresh --json
    - intent: build cited agent context from the vault
      command: agent-do obsidian context build "what did I decide about voice" --json
    - intent: ask the vault a question with citations
      command: agent-do obsidian chat "what is on my plate today?" --json
    - intent: save a note with related links
      command: agent-do obsidian save --content "Pricing experiment" --related auto --json
    - intent: ask the vault a question
      command: agent-do obsidian summarize "Trinity Site" --json
    - intent: choose next tasks
      command: agent-do obsidian tasks next --horizon today --json
    - intent: mark a project as done
      command: agent-do obsidian prop set status done --file "Projects/agent-obsidian"
    - intent: list backlinks for a note
      command: agent-do obsidian backlinks "agent-do roadmap"
    - intent: run obsidian dev tools (requires +live)
      command: agent-do +live(scope=desktop,app=Obsidian,ttl=15m) obsidian dev errors
    credentials:
      optional:
      - VOYAGE_API_KEY
      - OPENAI_API_KEY
      - COHERE_API_KEY
      features:
        VOYAGE_API_KEY:
          unlocks: default voyage-4-large semantic embeddings and Voyage rerank-2.5 reranking
          required_for:
          - embed refresh
          - semantic search with default model
          - hybrid search reranking
          recommended: true
          setup: agent-do creds store VOYAGE_API_KEY --stdin
        OPENAI_API_KEY:
          unlocks: GPT-5.5 vault chat and text-embedding-3-large fallback embeddings
          required_for:
          - chat
          - OpenAI embedding fallback
          recommended: true
          setup: agent-do creds store OPENAI_API_KEY --stdin
        COHERE_API_KEY:
          unlocks: future multimodal vault embeddings with Cohere embed-v4.0
          required_for:
          - multimodal asset indexing
          recommended: false
          setup: agent-do creds store COHERE_API_KEY --stdin
      notes:
      - Obsidian read, save, keyword search, tasks, graph, audit, and local indexing work without API keys.
      - Add VOYAGE_API_KEY for the recommended semantic vault index.
      - Add OPENAI_API_KEY for vault chat and the OpenAI embedding fallback.
    routing:
      discover_keywords:
      - obsidian
      - obsidian vault
      - obsidian note
      - daily note
      - backlinks
      - markdown vault
      - yaml frontmatter
      prompt_patterns:
      - \bobsidian\b
      - \bdaily note\b
      - \bbacklinks?\b
      - \bvault\b
      - \bfrontmatter\b
      intents:
      - label: vault_save_intent
        examples:
        - save this to my vault
        - put that in obsidian
        - lock this in
        recommended_entrypoint: agent-do obsidian save --content "..."
      - label: vault_find_intent
        examples:
        - find every note about X
        - where did I write about Y
        recommended_entrypoint: agent-do obsidian search "..." --mode hybrid --json
      - label: vault_ask_intent
        examples:
        - summarize my thinking on X
        - what do my notes say about Y
        recommended_entrypoint: agent-do obsidian context build "..." --json
      - label: vault_organize_intent
        examples:
        - what should I work on next
        - what's gone stale
        recommended_entrypoint: agent-do obsidian tasks next --json
      - label: vault_refactor_intent
        examples:
        - rename X to Y across my vault
        - merge tags A and B
        recommended_entrypoint: agent-do obsidian move "X" "Y" --update-links --json
      recommended_entrypoints:
      - agent-do obsidian doctor
      - agent-do obsidian snapshot
      - agent-do obsidian refresh --full --json
      - agent-do obsidian embed status --json
      - agent-do obsidian embed refresh --json
      - agent-do obsidian daily read
      - agent-do obsidian search <query> --mode keyword
      - agent-do obsidian search <query> --mode hybrid --json
      - agent-do obsidian context build <query> --json
      - agent-do obsidian chat <question> --json
      - agent-do obsidian save --content "..." --related auto --json
      default_command: snapshot
      raw_cli_equivalents:
      - pattern: \bobsidian\s+(read|create|append|search|daily|tasks|tags|backlinks)\b
        replacement: agent-do obsidian
        example: agent-do obsidian search "review"
        reason: agent-do wraps the obsidian CLI with structured discovery, doctor diagnostics, and +live gating
      - pattern: \bobsidian\s+--help\b
        replacement: agent-do obsidian --help
        example: agent-do obsidian --help
        reason: agent-do obsidian surfaces all commands with consistent help formatting
      project_signals:
      - .obsidian
      - obsidian
      readiness:
        check: agent-do obsidian doctor
        fix: agent-do obsidian doctor --fix
        note: Local index mode requires a vault path; CLI fallback requires the Obsidian desktop app
    contracts:
      connect:
      - doctor
      snapshot:
      - snapshot
      - read
      - search
      - embed status
      - context build
      - connections
      - query
      - relate
      - summarize
      - tasks list
      - tasks next
      - tags
      - backlinks
      - graph orphans
      - graph broken-links
      - graph clusters
      - graph cluster
      - graph tag-usage
      - daily read
      - daily list
      - weekly read
      - weekly list
      - period read
      - prop get
      - prop list
      - templates list
      - templates show
      interact:
      - refresh
      - embed refresh
      - chat
      - create
      - append
      - move
      - delete
      - prop set
      - prop batch
      - tasks add
      - tasks complete
      - tasks update
      - tags rename
      - tags merge
      - daily append
      - weekly append
      - templates apply
      - templates register
      - audit fix
      verify:
      - doctor
      - audit
      save:
      - save
      - save-group
      attributes:
        doctor: [composite]
        delete: [destructive]
        chat: [long_running]
        embed refresh: [long_running]
