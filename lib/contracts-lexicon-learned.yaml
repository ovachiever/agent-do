# Agent-derived contract classifications — REGENERABLE, do not hand-edit.
#
# Produced by the contracts-exception-classifier workflow (2026-06-11):
# parallel agents read each tool's --help and source for verbs the hand
# lexicon (contracts-lexicon.yaml) could not classify, and returned a beat
# assignment with confidence and evidence. Only high/medium confidence
# entries land here; low-confidence verbs stay in the exceptions report.
#
# Merge order: these load FIRST; hand-written overrides in
# contracts-lexicon.yaml always win. To correct an entry, add the verb to
# the hand lexicon's overrides — do not edit this file.
overrides:
  3d:
    view:
      beats:
      - interact
      confidence: medium
      reason: "cmd_view launches a GUI viewer (qlmanage -p / open / meshlab& / open3d draw_geometries)\
        \ \u2014 a side-effecting open, not a structured read. Beat varies a little by installed viewer\
        \ but always an interactive launch."
  agent:
    accept:
      beats:
      - interact
      confidence: high
      reason: "--help: 'Accept pending changes (press y)' \u2014 sends a keystroke to the agent TUI to\
        \ confirm/apply changes. Mutates agent-side state. Not destructive."
    reject:
      beats:
      - interact
      confidence: high
      reason: "--help: 'Reject pending changes (press n)' \u2014 sends keystroke to decline pending changes.\
        \ Mutates agent-side state; declining is not data loss, so not destructive."
    spawn:
      beats:
      - connect
      confidence: high
      reason: "cmd_spawn creates a new tmux session running an agent (claude/opencode/droid/amp) \u2014\
        \ brings the tool into a usable session state. Command returns after launch (or after --wait readiness);\
        \ the long-lived process is the spawned agent, not this call."
  appleevents:
    cache:
      attributes:
      - polymorphic
      - destructive
      beats:
      - snapshot
      - interact
      confidence: high
      reason: 'Source: ''cache status'' globs CACHE_DIR (read-only -> snapshot); ''cache clear'' path.unlink()s
        cached dictionaries (delete -> interact + destructive). Subcommand selects the beat at call time.'
    dictionary:
      beats:
      - snapshot
      confidence: high
      reason: '--help: ''Show scripting dictionary: json, markdown, raw''. Read-only dump of an app''s
        sdef (caching it is a benign read-cache side effect, no world mutation).'
    probe:
      beats:
      - snapshot
      confidence: high
      reason: '--help: ''Resolve app, inspect static scriptability, and load dictionary metadata''. Read-only
        inspection of static bundle scriptability; listed under READ-ONLY (distinct from the LIVE-GATED
        permissions/run verbs).'
    terms:
      beats:
      - snapshot
      confidence: high
      reason: '--help: ''Search commands, classes, and properties from the dictionary''. Read-only query
        over parsed dictionary metadata.'
  auth:
    import-browser:
      attributes:
      - composite
      - sensitive
      beats:
      - connect
      - save
      - verify
      confidence: medium
      reason: 'cmd_import_browser: browser_import creates a usable browse session (connect), apply_validation
        checks the state (verify), then persist_browse_alias/write_session_meta persists the imported
        auth for reuse (save). Persists secret auth material -> sensitive; multi-beat orchestration ->
        composite.'
    instructions:
      beats:
      - snapshot
      confidence: high
      reason: cmd_instructions reads the profile/session-meta and prints recommended next-step guidance.
        Pure read, no mutation or persistence.
    load:
      beats:
      - connect
      confidence: high
      reason: "cmd_load calls load_saved_session to restore previously saved authenticated browser state\
        \ into a usable session \u2014 bring-into-usable-state attach. Consumes stored secrets but does\
        \ not emit or newly persist them, so not sensitive under the strict definition."
  bluetooth:
    scan:
      beats:
      - snapshot
      confidence: high
      reason: 'cmd_scan runs blueutil --inquiry 10 (macOS) or bluetoothctl scan/devices (Linux): a bounded
        ~10s discovery that returns the device list. Read-only enumeration; bounded, so not long_running.'
  browse:
    auth check-creds:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Check if credentials exist for domain'. Reports existence only (does not output\
        \ the secret), so read-only snapshot, not sensitive \u2014 contrast get-creds which would emit\
        \ them."
    auth store-creds:
      attributes:
      - sensitive
      beats:
      - save
      confidence: high
      reason: '--help: ''Store credentials for future sessions'' (DOMAIN_EMAIL/DOMAIN_PASSWORD). Persists
        secret material for reuse -> save + sensitive.'
    clipboard paste:
      beats:
      - interact
      confidence: high
      reason: "--help: 'Send paste shortcut to the page'. Dispatches a paste keystroke into the page \u2014\
        \ mutates page/input state."
    session load:
      beats:
      - connect
      confidence: high
      reason: "Sends session_load action: creates a new browser context seeded with saved cookies+localStorage\
        \ and navigates to the saved URL \u2014 brings the browser into a usable authenticated state.\
        \ Consumes saved auth but does not emit/persist new secrets, so not sensitive under strict definition."
    vision analyze:
      beats:
      - snapshot
      confidence: medium
      reason: '--help: ''Analyze for patterns (errors|forms|login|products|navigation)''. AI-powered read
        of the current page screenshot returning a structured assessment; no world mutation. Medium because
        the JS side-effect surface wasn''t read line-by-line.'
    vision compare:
      beats:
      - snapshot
      confidence: medium
      reason: "--help: 'Compare screenshots for changes'. Read-only diff reporting changes, not a purposive\
        \ pass/fail/block \u2014 per rules a verification-usable read is snapshot, not verify."
    vision explain:
      beats:
      - snapshot
      confidence: medium
      reason: "--help: 'Predict what will happen if action taken'. Predicts an outcome WITHOUT performing\
        \ the action \u2014 read-only inference over current state."
  burp:
    issues:
      beats:
      - snapshot
      confidence: high
      reason: cmd_issues GETs /burp/scanner/issues and prints (optionally severity-filtered). Read-only
        listing of found findings.
    proxy:
      beats:
      - interact
      confidence: high
      reason: cmd_proxy on/off runs networksetup -setwebproxy/-setsecurewebproxy to mutate system network
        proxy settings. Both states mutate, so not polymorphic in beat; toggling off is not data loss.
    scan:
      beats:
      - interact
      confidence: high
      reason: "cmd_scan PUTs the URL into scope then POSTs spider + active scanner \u2014 an async deploy-style\
        \ trigger that returns immediately ('Scan initiated'). Mutating trigger -> interact; returns,\
        \ so not long_running."
  cad:
    measure:
      beats:
      - snapshot
      confidence: high
      reason: cmd_measure runs FreeCAD headless to read shape BoundBox/Volume/Area/CenterOfMass and print
        them. Read-only extraction of dimensions from the file.
    view:
      beats:
      - interact
      confidence: medium
      reason: "cmd_view launches a CAD GUI viewer (librecad/freecad& or macOS open) by file extension\
        \ \u2014 side-effecting open. Medium since exact behavior depends on installed viewer, but all\
        \ paths are an interactive launch."
  ci:
    trigger:
      beats:
      - interact
      confidence: high
      reason: '--help: ''trigger <workflow>'' dispatches a CI run via gh; async deploy-style mutation,
        returns immediately.'
  clerk:
    enterprise-connections:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'List enterprise connections (SAML/OIDC)' \u2014 read-only GET list."
    jwt-templates:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'List JWT templates' \u2014 read-only GET list; templates not secret material."
    oauth-apps:
      beats:
      - snapshot
      confidence: high
      reason: "--help 'List OAuth applications'; source cmd_oauth_apps (l.952-967) prints only id/name/client_id\
        \ + [public] flag, never client_secret \u2014 read-only, not sensitive."
    org-add-member:
      beats:
      - interact
      confidence: high
      reason: "--help: 'org-add-member <org> <user> [--role]' \u2014 POST adds member to org, state mutation."
    org-members:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'List members' \u2014 read-only GET list."
    roles:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'List organization roles' \u2014 read-only GET list."
  clipboard:
    paste:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Print clipboard contents' \u2014 read-only dump of clipboard state, no side effects.\
        \ (Output is arbitrary and could echo secrets a user copied, but the verb is not secret-handling\
        \ by design.)"
  cloudflare:
    analytics:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Raw GraphQL query against Cloudflare Analytics' \u2014 Analytics GraphQL endpoint\
        \ is read-only; arbitrary query string but cannot mutate, so snapshot not passthrough."
    bandwidth:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Bandwidth summary' \u2014 read-only analytics aggregate."
    dns:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'dns <zone>  List DNS records' \u2014 read-only list (add/del/update are separate\
        \ verbs)."
    firewall-events:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Recent firewall events' \u2014 read-only security event log dump."
    r2-buckets:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'List R2 buckets' \u2014 read-only list."
    requests:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Request summary: total, cached, threats blocked' \u2014 read-only analytics aggregate."
    threats:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Security threats: blocked, types, top source countries' \u2014 read-only analytics\
        \ aggregate."
    top-countries:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Top countries by visitor count' \u2014 read-only analytics aggregate."
    top-pages:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Top pages by request count' \u2014 read-only analytics aggregate."
    visitors 24h:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'visitors <zone> [--since N]' default 24h \u2014 read-only visitor analytics summary."
    visitors 7d:
      beats:
      - snapshot
      confidence: high
      reason: "--help: same 'visitors' verb with --since 7d \u2014 read-only visitor analytics summary,\
        \ window is only a flag."
  colab:
    run:
      beats:
      - interact
      confidence: high
      reason: "source cmd_run: 'jupyter nbconvert --execute --to notebook --inplace' executes notebook\
        \ cells (arbitrary code, real side effects) and rewrites the file in place \u2014 a transform/mutation.\
        \ Not flagged passthrough because it is a purpose-built notebook executor, not a generic eval\
        \ string; the inplace file mutation is the dominant contract."
  context:
    build:
      beats:
      - interact
      confidence: high
      reason: "source lib/build.sh cmd_build: walks a content dir for DOC.md/SKILL.md, parses frontmatter,\
        \ packages into an output dir (default dist) \u2014 file transform A->B producing artifacts."
    cache pin:
      beats:
      - interact
      confidence: high
      reason: "source lib/cache.sh _cache_pin: appends pkg id to _pins.json so it is never evicted \u2014\
        \ persistent state-mutation policy flag, not a new saved result."
    crawl:
      attributes:
      - composite
      beats:
      - interact
      - save
      confidence: high
      reason: "source lib/html.sh cmd_crawl: fetches bounded same-origin HTML, extracts text/metadata,\
        \ and indexes content into the persistent ~/.agent-do/context library \u2014 one call does network\
        \ fetch+transform (interact) plus durable persistence for future sessions (save)."
    stale:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Show stale or failed packages' \u2014 read-only status report; merely-usable read,\
        \ not a purposive pass/fail, so snapshot not verify."
  coord:
    alias:
      beats:
      - interact
      confidence: high
      reason: "--help/source alias_self: 'Assign a friendly alias to this agent' \u2014 writes alias into\
        \ the agent presence record, state mutation."
    claim soft:
      beats:
      - interact
      confidence: high
      reason: "source: 'claim <path> --strength soft' (default) writes an advisory claim into claims.json\
        \ \u2014 coordination state mutation, not destructive."
    claim strong:
      beats:
      - interact
      confidence: high
      reason: "source: 'claim <path> --strength strong' writes a stronger advisory lock into claims.json\
        \ \u2014 same mutation path, higher strength field; not destructive (release is separate)."
  creds:
    platform:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'Show detected credential backend platform' \u2014 read-only, reports backend name\
        \ only, no secret values."
    required:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'required <tool>  List secrets declared for a tool' \u2014 read-only list of secret\
        \ KEY NAMES only, no values emitted, so not sensitive."
  debug:
    backtrace:
      beats:
      - snapshot
      confidence: medium
      reason: Reads the current call stack of an attached debug session (standard debugger bt); pure read.
        Verb not in the bash dispatch (--help lists pdb cmds without backtrace), so wiring is ambiguous
        but semantics are unmistakable.
    break:
      beats:
      - interact
      confidence: high
      reason: "--help: 'break <file:line> Set breakpoint' \u2014 mutates debugger session state."
    continue:
      beats:
      - interact
      confidence: high
      reason: "--help: 'continue Continue execution' \u2014 advances/resumes program execution, mutating\
        \ run state."
    print:
      beats:
      - snapshot
      confidence: medium
      reason: "--help: 'print <expr> Print expression' \u2014 reads/displays a value from the frame. Medium:\
        \ pdb print evaluates an arbitrary expression, which could in principle have side effects, but\
        \ documented purpose is read."
    step:
      beats:
      - interact
      confidence: high
      reason: "--help: 'step Step into' \u2014 advances execution one statement, mutating run state."
  dns:
    lookup:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'lookup <domain> [type] DNS lookup' \u2014 read-only resolver query returning records,\
        \ no side effects. Not verify: it dumps records rather than asserting a condition (that would\
        \ be a dns-check)."
  docker:
    compose:
      attributes:
      - polymorphic
      beats:
      - interact
      - snapshot
      confidence: medium
      reason: 'cmd_compose dispatches by subcommand: ''up'' runs ''docker compose up -d'' (interact, detached
        so returns), ''down'' is graceful teardown (interact, not destructive), ''logs''/''ps'' read (snapshot),
        plus a generic passthrough to any compose subcommand. Beat is payload-decided.'
    start:
      beats:
      - interact
      confidence: high
      reason: "--help: 'start <name> Start container' \u2014 brings a stopped container to running; mutates\
        \ world state. Not destructive."
  email:
    code:
      attributes:
      - composite
      - sensitive
      beats:
      - verify
      - snapshot
      confidence: high
      reason: handle_code always calls wait_for_message (polls every interval until a matching message
        arrives or times out, default --timeout 120) = block-until-condition (verify), then extract_code
        reads the value (snapshot). Emits a verification code = secret material (sensitive).
    latest:
      beats:
      - snapshot
      confidence: high
      reason: "handle_latest calls find_message once (no polling loop) and emits the latest matching message\
        \ \u2014 read-only dump of mailbox state."
    link:
      attributes:
      - composite
      - sensitive
      beats:
      - verify
      - snapshot
      confidence: high
      reason: handle_link always calls wait_for_message (block-until matching message or timeout, default
        120) = verify, then extract_link reads the URL = snapshot. Emits a magic login link = secret auth
        material (sensitive).
  eval:
    compare:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'compare <a> <b> Compare two runs' \u2014 reads two saved result JSON files and\
        \ diffs them; read-only, no side effects."
    results:
      beats:
      - snapshot
      confidence: high
      reason: "cmd_results lists or shows saved *.json result files under EVAL_DIR \u2014 read-only dump\
        \ of prior run state."
    run:
      attributes:
      - composite
      beats:
      - interact
      - verify
      - save
      confidence: high
      reason: 'Source: for each case calls the Anthropic API (and type=code executes code) = interact/side
        effects; evaluates pass/fail per case (exact/contains/regex/rubric/code) = purposive verify; then
        writes a timestamped results JSON (lines 132-135) = save. One call performs all three.'
  excel:
    formula:
      beats:
      - interact
      confidence: high
      reason: "--help: 'formula <cell> <expr> Set formula' \u2014 writes a formula into a cell, mutating\
        \ the workbook."
    sheet name:
      beats:
      - interact
      confidence: medium
      reason: '''sheet <name>'' switches the active sheet, mutating agent-side session context that subsequent
        reads/writes target. Borderline connect-vs-interact: it is a non-destructive selection within
        an already-open workbook (open is the real connect), so classified as agent-side state mutation
        = interact.'
    sheets:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'sheets List all sheets' \u2014 read-only enumeration of workbook structure."
  gcp:
    apis:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'apis <project> List enabled APIs' \u2014 read-only listing via REST API; no mutation,\
        \ no secret material."
    service-accounts:
      beats:
      - snapshot
      confidence: high
      reason: "--help: 'service-accounts <project> List service accounts' \u2014 read-only listing of\
        \ SA identities (not keys), no side effects. Key creation/listing are separate sa-key-* verbs."
  gh:
    approve:
      beats:
      - interact
      confidence: high
      reason: "cmd_review_action with --approve runs `gh pr review --approve` \u2014 posts an approval\
        \ review, mutating PR review state (source tools/agent-gh:1411,1656)."
    checkout:
      beats:
      - interact
      confidence: medium
      reason: "cmd_checkout runs `gh pr checkout` \u2014 creates/switches a local branch, a working-tree\
        \ mutation; connect-flavored prep but a real local state change, so interact (source :1507)."
    comment:
      beats:
      - interact
      confidence: high
      reason: "cmd_review_action with --comment runs `gh pr review --comment` \u2014 posts a PR comment,\
        \ mutates the PR thread (source :1411,1658)."
    doctrine:
      beats:
      - snapshot
      confidence: high
      reason: "cmd_doctrine prints the static REVIEW_DOCTRINE constant \u2014 read-only emit, touches\
        \ no state (source :1372). Mirrors latex `template` snapshot precedent."
    draft:
      beats:
      - interact
      confidence: high
      reason: "cmd_ready(draft=True) runs `gh pr ready --undo` \u2014 converts PR to draft, mutates PR\
        \ state (source :1563,1736)."
    ready:
      beats:
      - interact
      confidence: high
      reason: "cmd_ready runs `gh pr ready` \u2014 marks PR ready for review, mutates PR state (source\
        \ :1563)."
    reopen:
      beats:
      - interact
      confidence: high
      reason: "cmd_reopen runs `gh pr reopen` \u2014 reopens a closed PR, mutates state (source :1497)."
    request-changes:
      beats:
      - interact
      confidence: high
      reason: "cmd_review_action with --request-changes (body required) runs `gh pr review --request-changes`\
        \ \u2014 posts a review, mutates PR (source :1411,1657)."
    review:
      beats:
      - snapshot
      confidence: high
      reason: "cmd_review_summary reads PR detail/checks/threads, classifies risk, prints summary + doctrine\
        \ \u2014 read-only dump, posts nothing. Lexicon principle 1: a read usable for verification stays\
        \ snapshot; the merge gate (not review) is the verify (source :1340)."
    update-branch:
      beats:
      - interact
      confidence: high
      reason: "cmd_update_branch runs `gh pr update-branch` \u2014 merges/rebases base into the PR branch\
        \ on the remote, mutates the branch (source :1554)."
  ghidra:
    analyze:
      beats:
      - interact
      confidence: medium
      reason: "cmd_analyze runs analyzeHeadless -import -overwrite \u2014 imports binary, runs auto-analysis,\
        \ writes a Ghidra project DB to $GHIDRA_PROJECT. A transform/derivation with a persistent project\
        \ side-effect (lexicon principle 3: transforms are interact) (source tools/agent-ghidra:48)."
    decompile:
      beats:
      - interact
      confidence: medium
      reason: "cmd_decompile imports+overwrites a project then runs a decomp postScript and prints C source\
        \ \u2014 a read-shaped derivation that still writes a project DB side-effect. Principle 3 (transforms\u2192\
        interact) puts it in interact, though it borders on snapshot since output is just stdout (source\
        \ :70)."
    strings:
      beats:
      - snapshot
      confidence: high
      reason: "cmd_strings shells out to system `strings -n <min>` \u2014 pure read of the binary, no\
        \ side effects (source :117)."
  git:
    branch:
      attributes:
      - polymorphic
      beats:
      - snapshot
      - interact
      confidence: high
      reason: 'Bare `branch` lists branches (snapshot); `branch <name>` creates and switches to a branch
        (interact). Beat decided by presence of the name argument at call time (help text + lexicon `branches:
        snapshot`).'
    commit:
      beats:
      - interact
      confidence: high
      reason: "Commits staged changes (auto-generates message if absent) \u2014 mutates repo history.\
        \ Lexicon principle 2 explicitly: for commit-backed flows interact subsumes save; no separate\
        \ save beat invented (help text)."
    stash:
      beats:
      - interact
      confidence: high
      reason: '`stash` and `stash pop` both mutate the working tree and the stash stack; reversible, so
        interact without destructive (per lexicon principle 5 graceful-mutation rule) (help text).'
  hardware:
    printer default:
      attributes:
      - polymorphic
      beats:
      - snapshot
      - interact
      confidence: high
      reason: 'cmd_default: no arg runs `lpstat -d` to show the default (snapshot); with a printer name
        runs `lpoptions/lpadmin -d` to set it (interact). Beat decided by argument at call time (source
        tools/agent-printer:46).'
    printer print:
      beats:
      - interact
      confidence: high
      reason: "cmd_print runs `lp` to submit a print job \u2014 real-world side effect (source :72)."
    printer queue:
      beats:
      - snapshot
      confidence: high
      reason: "cmd_queue runs `lpq -a`/`lpstat -o` \u2014 read-only dump of the print queue (source :131)."
    serial config:
      beats:
      - snapshot
      confidence: high
      reason: cmd_config runs ONLY `stty -a` (show). Despite the help's 'Show/set port configuration'
        label, the source is read-only; setting raw mode lives in the separate `raw` verb (source tools/agent-serial:111).
        Help/source mismatch noted.
    usb disks:
      beats:
      - snapshot
      confidence: high
      reason: "cmd_disks runs `diskutil list`/`lsblk` \u2014 read-only disk/volume listing (source tools/agent-usb:157)."
    usb eject:
      beats:
      - interact
      confidence: high
      reason: "cmd_eject runs `diskutil eject`/`udisksctl power-off` \u2014 graceful device release. Lexicon\
        \ principle 5: graceful release is plain interact, not destructive (source tools/agent-usb:~76)."
    usb mount:
      beats:
      - interact
      confidence: high
      reason: "cmd_mount runs `diskutil mount`/`udisksctl mount` \u2014 mutates the system mount table\
        \ to make storage usable. Connect-flavored but a system mutation, so interact (source tools/agent-usb:109)."
    usb unmount:
      beats:
      - interact
      confidence: high
      reason: "cmd_unmount runs `diskutil unmount`/`umount` \u2014 graceful release, mutates mount table;\
        \ interact without destructive (source tools/agent-usb:136)."
  harness:
    contracts propose:
      attributes:
      - polymorphic
      beats:
      - snapshot
      - save
      confidence: medium
      reason: contracts_propose derives a lexicon-driven contracts draft from the registry (read-only
        on tracked state). Default prints the proposal/stats to stdout (snapshot, cf. latex `template`
        emits-to-stdout precedent); `--out FILE` exports a markdown inventory (save). Beat flips on the
        --out flag (source tools/agent-harness:156).
    evidence:
      attributes:
      - composite
      beats:
      - save
      confidence: medium
      reason: "evidence build gathers session context + nudge telemetry (internal reads) then writes a\
        \ persisted bundle dir .agent-do-harness/evidence/<run> (jsonl + markdown) for future drill-down\
        \ \u2014 persistence of a result (lexicon principle 2); composite flags the internal gather (source\
        \ tools/agent-harness:609)."
    manifest:
      attributes:
      - polymorphic
      beats:
      - save
      - verify
      confidence: high
      reason: 'Two subcommands: `manifest new` writes a manifest.json of predictions/decisions for a future
        check (save, decide-shaped); `manifest verify` compares before/after eval-case flips against the
        manifest''s predictions and writes a pass/fail verdict (verify). Beat decided by subcommand (source
        tools/agent-harness:762,820).'
    nudges:
      beats:
      - snapshot
      confidence: high
      reason: "nudges effectiveness summarizes nudge telemetry and current compliance limits \u2014 read-only\
        \ report, like stats/history (source tools/agent-harness:~536; help text)."
  homekit:
    scene:
      beats:
      - interact
      confidence: high
      reason: "Registry 'scene: Run scene'; source aliases scene\u2192cmd_run which runs `shortcuts run\
        \ \"$scene\"` to trigger a HomeKit scene \u2014 real-world side effect (source tools/agent-homekit:75,217)."
  ide:
    goto:
      beats:
