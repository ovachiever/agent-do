  write: {beats: [interact]}
  append: {beats: [interact]}
  insert: {beats: [interact]}
  upload: {beats: [interact]}
  install: {beats: [interact]}
  uninstall: {beats: [interact], attributes: [destructive]}
  import: {beats: [interact]}
  apply: {beats: [interact]}
  register: {beats: [interact]}
  rename: {beats: [interact]}
  move: {beats: [interact]}
  copy: {beats: [interact]}
  restart: {beats: [interact]}
  launch: {beats: [interact]}
  deploy: {beats: [interact]}
  restore: {beats: [interact]}
  scale: {beats: [interact]}
  suspend: {beats: [interact]}
  resume: {beats: [interact]}
  cancel: {beats: [interact]}
  promote: {beats: [interact]}
  sync: {beats: [interact]}
  refresh: {beats: [interact]}
  fetch: {beats: [interact]}
  pull: {beats: [interact]}
  push: {beats: [interact]}
  click: {beats: [interact]}
  dblclick: {beats: [interact]}
  fill: {beats: [interact]}
  type: {beats: [interact]}
  press: {beats: [interact]}
  tap: {beats: [interact]}
  swipe: {beats: [interact]}
  scroll: {beats: [interact]}
  hover: {beats: [interact]}
  drag: {beats: [interact]}
  select: {beats: [interact]}
  focus: {beats: [interact]}
  mute: {beats: [interact]}
  unmute: {beats: [interact]}
  share: {beats: [interact]}
  reload: {beats: [interact]}
  back: {beats: [interact]}
  forward: {beats: [interact]}
  viewport: {beats: [interact]}
  convert: {beats: [interact]}
  rip: {beats: [interact], attributes: [long_running]}
  backup: {beats: [interact], attributes: [long_running]}
  resize: {beats: [interact]}
  compress: {beats: [interact]}
  crop: {beats: [interact]}
  rotate: {beats: [interact]}
  flip: {beats: [interact]}
  trim: {beats: [interact]}
  merge: {beats: [interact]}
  split: {beats: [interact]}
  render: {beats: [interact]}
  generate: {beats: [interact]}
  scaffold: {beats: [interact]}
  annotate: {beats: [save]}
  feedback: {beats: [save]}

  # ── teardown: graceful release (interact) vs data loss (destructive) ──
  stop: {beats: [interact]}
  close: {beats: [interact]}
  disconnect: {beats: [interact]}
  shutdown: {beats: [interact]}
  logout: {beats: [interact]}
  abandon: {beats: [interact]}
  release: {beats: [interact]}
  delete: {beats: [interact], attributes: [destructive]}
  remove: {beats: [interact], attributes: [destructive]}
  clear: {beats: [interact], attributes: [destructive]}
  reset: {beats: [interact], attributes: [destructive]}
  erase: {beats: [interact], attributes: [destructive]}
  purge: {beats: [interact], attributes: [destructive]}
  prune: {beats: [interact], attributes: [destructive]}
  clean: {beats: [interact], attributes: [destructive]}
  kill: {beats: [interact], attributes: [destructive]}

  # ── save: persist a result ──
  save: {beats: [save]}
  store: {beats: [save]}
  export: {beats: [save]}
  learn: {beats: [save]}
  decide: {beats: [save]}

  # ── polymorphic: beat decided by payload/flag ──
  query: {beats: [snapshot, interact], attributes: [polymorphic]}
  sql: {beats: [snapshot, interact], attributes: [polymorphic]}
  rest: {beats: [snapshot, interact], attributes: [polymorphic]}
  retrieve: {beats: [snapshot, interact], attributes: [polymorphic]}
  harvest: {beats: [snapshot, interact], attributes: [polymorphic]}

  # ── passthrough / long-running: beat-less by design ──
  shell: {attributes: [passthrough]}
  eval: {attributes: [passthrough]}
  tell: {attributes: [passthrough]}
  repl: {attributes: [passthrough]}
  watch: {attributes: [long_running]}
  serve: {attributes: [long_running]}
  stream: {beats: [interact], attributes: [long_running, passthrough]}
  monitor: {attributes: [long_running]}
  follow: {attributes: [long_running]}
  tail: {attributes: [long_running]}
  record: {beats: [interact], attributes: [long_running]}
  capture: {beats: [interact], attributes: [long_running]}
  transcribe: {beats: [interact, save], attributes: [composite, long_running]}
  chat: {beats: [interact], attributes: [long_running]}

patterns:
  # Ordered; first match wins. Single leading or trailing `*` only.
  - {match: "*-list", beats: [snapshot]}
  - {match: "*-show", beats: [snapshot]}
  - {match: "*-get", beats: [snapshot]}
  - {match: "*-status", beats: [snapshot]}
  - {match: "*-info", beats: [snapshot]}
  - {match: "*-logs", beats: [snapshot]}
  - {match: "*-check", beats: [verify]}
  - {match: "*-create", beats: [interact]}
  - {match: "*-new", beats: [interact]}
  - {match: "*-add", beats: [interact]}
  - {match: "*-set", beats: [interact]}
  - {match: "*-update", beats: [interact]}
  - {match: "*-upsert", beats: [interact]}
  - {match: "*-merge", beats: [interact]}
  - {match: "*-rename", beats: [interact]}
  - {match: "*-import", beats: [interact]}
  - {match: "*-deploy", beats: [interact]}
  - {match: "*-scale", beats: [interact]}
  - {match: "*-restart", beats: [interact]}
  - {match: "*-invite", beats: [interact]}
  - {match: "*-del", beats: [interact], attributes: [destructive]}
  - {match: "*-delete", beats: [interact], attributes: [destructive]}
  - {match: "*-remove", beats: [interact], attributes: [destructive]}
  - {match: "*-revoke", beats: [interact], attributes: [destructive]}
  - {match: "*-rotate", beats: [interact], attributes: [sensitive]}
  - {match: "*-export", beats: [save]}
  - {match: "list-*", beats: [snapshot]}
  - {match: "get-*", beats: [snapshot]}
  - {match: "show-*", beats: [snapshot]}
  - {match: "set-*", beats: [interact]}
  - {match: "add-*", beats: [interact]}
  - {match: "create-*", beats: [interact]}
  - {match: "delete-*", beats: [interact], attributes: [destructive]}
  - {match: "remove-*", beats: [interact], attributes: [destructive]}
  - {match: "reset-*", beats: [interact], attributes: [destructive]}
  - {match: "fetch-*", beats: [interact]}
  - {match: "scan-*", beats: [interact]}
  - {match: "*-enable", beats: [interact]}
  - {match: "*-disable", beats: [interact]}
  - {match: "*-activate", beats: [interact]}
  - {match: "*-deactivate", beats: [interact]}
  - {match: "*-apply", beats: [interact]}
  - {match: "*-assign-group", beats: [interact]}
  - {match: "*-link", beats: [interact]}
  - {match: "*-unlink", beats: [interact]}
  - {match: "*-push", beats: [interact]}
  - {match: "*-trigger", beats: [interact]}
  - {match: "*-reschedule", beats: [interact]}
  - {match: "*-renew", beats: [interact]}
  - {match: "*-purge", beats: [interact], attributes: [destructive]}
  - {match: "*-reset", beats: [interact], attributes: [destructive]}
  - {match: "*-cancel", beats: [interact]}
  - {match: "*-diff", beats: [snapshot]}
  - {match: "*-versions", beats: [snapshot]}
  - {match: "*-eligibility", beats: [snapshot]}
  - {match: "*-keys", beats: [snapshot], attributes: [sensitive]}
  # Space-separated namespaced forms ("env-group link", "auth status").
  - {match: "* list", beats: [snapshot]}
  - {match: "* show", beats: [snapshot]}
  - {match: "* status", beats: [snapshot]}
  - {match: "* get", beats: [snapshot]}
  - {match: "* read", beats: [snapshot]}
  - {match: "* next", beats: [snapshot]}
  - {match: "* events", beats: [snapshot]}
  - {match: "* snapshots", beats: [snapshot]}
  - {match: "* syncs", beats: [snapshot]}
  - {match: "* token", beats: [snapshot], attributes: [sensitive]}
  - {match: "* secret", beats: [snapshot], attributes: [sensitive]}
  - {match: "* set", beats: [interact]}
  - {match: "* add", beats: [interact]}
  - {match: "* link", beats: [interact]}
  - {match: "* unlink", beats: [interact]}
  - {match: "* enable", beats: [interact]}
  - {match: "* disable", beats: [interact]}
  - {match: "* run", beats: [interact]}
  - {match: "* trigger", beats: [interact]}
  - {match: "* reschedule", beats: [interact]}
  - {match: "* play", beats: [interact]}
  - {match: "* scan", beats: [interact]}
  - {match: "* del", beats: [interact], attributes: [destructive]}
  - {match: "* delete", beats: [interact], attributes: [destructive]}
  - {match: "* del-var", beats: [interact], attributes: [destructive]}
  - {match: "* clear", beats: [interact], attributes: [destructive]}

# Per-tool corrections where a verb's generic meaning is wrong for that tool.
# These were seeded from the 2026-06-11 stress-test evidence and grow during
# review. `skip: true` excludes a verb from proposing (manual review item).
overrides:
  gh:
    portfolio add: {beats: [interact], attributes: [own_state]}     # writes only ~/.agent-do/gh/portfolio.yaml
    portfolio remove: {beats: [interact], attributes: [own_state]}
    portfolio list: {beats: [snapshot]}
  browse:
    check: {beats: [interact]}          # checks a checkbox, not a condition
    open: {beats: [connect]}
    agent: {beats: [interact], attributes: [composite, long_running]}  # autonomous goal loop
    auth get-creds: {beats: [snapshot], attributes: [sensitive]}       # prints stored credentials
  creds:
    check: {beats: [verify]}
    store: {beats: [save], attributes: [sensitive]}
    delete: {beats: [interact], attributes: [destructive, sensitive]}
  resend:
    verify: {beats: [interact]}         # POSTs a verification trigger; dns-check is the real verify
  screen:
    snapshot: {beats: [snapshot]}       # caches elements to state file; honest enough as snapshot
    describe: {beats: [snapshot], attributes: [long_running]}  # paid LLM vision call, non-deterministic
  gcp:
    secret-get: {beats: [snapshot], attributes: [sensitive]}
    sa-key-create: {beats: [interact], attributes: [sensitive]}
    oauth-setup: {beats: [interact], attributes: [composite, long_running]}
  render:
    db: {beats: [snapshot, interact], attributes: [polymorphic, sensitive]}  # db recover destroys by flag; db connect-info reveals DSN
    secret get: {beats: [snapshot], attributes: [sensitive]}        # reveals secret value; "* get" pattern outran "* secret"
    kv connect-info: {beats: [snapshot], attributes: [sensitive]}   # returns DSN with credentials
  android:
    logcat: {attributes: [long_running]}
  ios:
    screenrecord: {beats: [interact], attributes: [long_running]}
    delete: {beats: [interact], attributes: [destructive]}
    erase: {beats: [interact], attributes: [destructive]}
  latex:
    preview: {beats: [interact]}        # compiles then opens GUI viewer
    template: {beats: [snapshot]}       # emits skeleton to stdout
    bib: {beats: [snapshot, interact], attributes: [polymorphic]}
  appleevents:
    run: {attributes: [passthrough]}
    permissions: {beats: [verify], attributes: [composite]}  # probing sends a real AppleEvent
    compile: {beats: [verify]}
  auth:
    ensure: {beats: [connect], attributes: [composite, long_running]}
    advance: {beats: [interact], attributes: [composite]}
    probe: {beats: [snapshot], attributes: [composite]}
  harness:
    quantity: {beats: [snapshot]}   # reads models.yaml; writes nothing anywhere
    census: {beats: [snapshot]}     # counts what exists; `rows` only runs verbs already declared read-only
    bounds: {beats: [verify]}       # grades declared caps against the authority; `scan` only reads a tree
  context:
    maintain: {beats: [interact], attributes: [composite, destructive]}  # refresh + prune cache
  obsidian: {}                          # declared block preserved; overrides unused
  notify:
    emit: {beats: [interact], attributes: [composite]}
    send: {beats: [interact]}
  zpc:
    checkpoint: {beats: [interact], attributes: [composite]}
    harvest: {beats: [snapshot, interact, save], attributes: [polymorphic]}  # consolidation scan; --auto writes patterns
    review: {beats: [snapshot, interact], attributes: [polymorphic]}
    query: {beats: [snapshot]}      # free-text/tag memory search; blind query→polymorphic rule wrong here
    position: {beats: [snapshot, save], attributes: [polymorphic]}  # list/show read, add/flip persist the ledger
    retract: {beats: [save]}        # appends a correction row; never edits or deletes the claim it corrects
    inject: {beats: [snapshot, interact], attributes: [polymorphic]}  # emits the blob; --relitigate spends a model and can file challenges
    counsel: {beats: [interact], attributes: [long_running, own_state]}  # spawns a fresh model; writes only its own access-log row
  coord:
    touch: {beats: [interact], attributes: [composite]}     # lease renewal returning a snapshot
    interrupts: {beats: [snapshot, interact], attributes: [polymorphic]}  # --mark-seen writes cursor
    guard: {beats: [snapshot, interact], attributes: [polymorphic]}  # check reads, install writes the hook
    bye: {beats: [interact], attributes: [destructive]}     # deletes own board records
    role: {beats: [interact]}                               # role set declares territory
    territory: {beats: [snapshot]}                          # ownership map render
    drop: {beats: [interact]}                               # file-pointer handoff onto the board
    drops: {beats: [snapshot]}                              # list drops
  manna:
    claim: {beats: [interact]}
    done: {beats: [interact]}
    block: {beats: [interact]}
    unblock: {beats: [interact]}
    dream: {beats: [interact]}
    lint: {beats: [verify]}
    reconcile: {beats: [verify, interact], attributes: [polymorphic]}  # read by default, writes under --fix
  docker:
    exec: {attributes: [passthrough]}
  psql:
    exec: {beats: [interact], attributes: [polymorphic]}
    dump: {beats: [save]}
    restore: {beats: [interact], attributes: [destructive]}
  db:
    exec: {beats: [interact], attributes: [polymorphic]}
  tui:
    spawn: {beats: [connect], attributes: [long_running]}   # not idempotent; new session per call
    attach: {beats: [snapshot]}                              # prints a tmux handoff string
  # ── 2026-06-11 review pass (false-safe hunt over the full inventory) ──
  metrics:
    cpu: {beats: [snapshot]}        # registry entry was fiction (query/alert/dashboard);
    memory: {beats: [snapshot]}     # rewritten to the tool's real read-only surface
    disk: {beats: [snapshot]}
    network: {beats: [snapshot]}
    processes: {beats: [snapshot]}
    load: {beats: [snapshot]}
    uptime: {beats: [snapshot]}
    all: {beats: [snapshot]}
  notion:
    data-sources query: {beats: [snapshot]}  # Notion query API is read-only filter/sort
  hardware:
    bluetooth scan: {beats: [snapshot]}      # delegates to bluetooth tool; bounded inquiry read
  sms:
    code: {beats: [snapshot, verify], attributes: [composite, sensitive]}  # emits OTP codes; matches email's shape
    link: {beats: [snapshot, verify], attributes: [composite, sensitive]}  # emits magic links
  jupyter:
    kernel: {beats: [interact], attributes: [destructive]}  # kernel restart discards in-memory session state
  voice:
    listen: {beats: [snapshot], attributes: [long_running]}  # microphone listening is by-design unbounded
  # ── own_state pass (2026-06-12, Erik decision #1): self-confined writers
  # keep concurrency:read; their write verbs carry own_state. Mirrors registry.
  prompt:
    save: {beats: [save], attributes: [own_state]}
  dpt:
    baseline: {beats: [snapshot, save], attributes: [composite, own_state]}
    build: {beats: [interact], attributes: [own_state]}
  eval:
    create: {beats: [interact], attributes: [own_state]}
    run: {beats: [interact, verify, save], attributes: [composite, own_state]}
  ghidra:
    analyze: {beats: [interact], attributes: [own_state]}
    decompile: {beats: [interact], attributes: [own_state]}
  pdf2md:
    batch: {beats: [interact], attributes: [own_state]}
    convert: {beats: [interact], attributes: [own_state]}
  tail:
    prune: {beats: [interact], attributes: [destructive, own_state]}
    stop: {beats: [interact], attributes: [own_state]}
  vision:
    detect: {beats: [snapshot, interact], attributes: [polymorphic, own_state]}
    source file: {beats: [connect], attributes: [own_state]}
    source image: {beats: [connect], attributes: [own_state]}
    source ios: {beats: [connect], attributes: [own_state]}
    source rtsp: {beats: [connect], attributes: [own_state]}
    source screen: {beats: [connect], attributes: [own_state]}
    source webcam: {beats: [connect], attributes: [own_state]}
    source window: {beats: [connect], attributes: [own_state]}
  wireshark:
    capture: {beats: [interact], attributes: [long_running, own_state]}
    filter: {beats: [interact], attributes: [own_state]}
  figma:
    export: {beats: [save], attributes: [own_state]}
  debug:
    break: {beats: [interact], attributes: [own_state]}
    continue: {beats: [interact], attributes: [own_state]}
    step: {beats: [interact], attributes: [own_state]}
