# Contracts lexicon — the canonical verb → beat/attribute mapping.
#
# This file is the SOURCE OF TRUTH for proposing contracts blocks across the
# registry. `agent-do harness contracts propose` applies it mechanically;
# the generated inventory is a build product, never hand-edited. To change a
# classification, change this file (or `overrides:`) and regenerate.
#
# ── Principles ────────────────────────────────────────────────────────────
# 1. VERIFY IS PURPOSIVE, NOT CONTEXTUAL. A verb is verify only if its output
#    is pass/fail or it blocks until a condition holds (wait, validate,
#    dns-check, doctor). Reads that an agent may *use* to verify (status,
#    logs) remain snapshot — otherwise every read dual-lists and the beat
#    loses meaning.
# 2. SAVE IS PERSISTENCE OF A RESULT. save/store/export/learn-shaped verbs.
#    For commit-backed tools (manna, notify history) Interact subsumes Save;
#    no separate save verbs are invented.
# 3. TRANSFORMS ARE INTERACT. convert/resize/compress/merge/split derive a
#    new artifact; they declare interact, and the audit relaxes atomicity
#    for them rather than the registry inventing a sixth beat.
# 4. ASYNC TRIGGERS ARE INTERACT. deploy/restore return a handle while the
#    change lands later; declared interact, paired verify is audit guidance.
# 5. DESTRUCTIVE IS AN ATTRIBUTE, NOT A BEAT. Teardown that loses data
#    (delete/erase/reset/clear/kill) is interact + destructive. Graceful
#    release (stop/close/disconnect/logout) is plain interact.
# 6. ESCAPE HATCHES ARE PASSTHROUGH. shell/eval/tell run opaque payloads;
#    they carry the passthrough attribute and belong to no beat.
# 7. THE BEAT OF A POLYMORPHIC VERB IS DECIDED AT CALL TIME. query/sql/rest
#    dual-list snapshot+interact and carry polymorphic.
# 8. CONSISTENCY BEATS PURISM. Where shipped blocks (api, obsidian,
#    transcribe) embody a convention — doctor as connect+verify+composite,
#    first-token matching for namespaced verbs — the lexicon follows them.
#
# Rule resolution order per verb: overrides[tool][verb] → exact[verb] →
# first matching pattern. Anything unresolved lands in the exceptions
# report for human review. Patterns use a single leading or trailing `*`.

version: 1

exact:
  # ── snapshot: structured reads ──
  snapshot: {beats: [snapshot]}
  list: {beats: [snapshot]}
  show: {beats: [snapshot]}
  status: {beats: [snapshot]}
  read: {beats: [snapshot]}
  get: {beats: [snapshot]}
  search: {beats: [snapshot]}
  find: {beats: [snapshot]}
  info: {beats: [snapshot]}
  scan: {beats: [snapshot]}
  describe: {beats: [snapshot]}
  inspect: {beats: [snapshot]}
  stats: {beats: [snapshot]}
  history: {beats: [snapshot]}
  logs: {beats: [snapshot]}
  triage: {beats: [snapshot]}
  diff: {beats: [snapshot]}
  peers: {beats: [snapshot]}
  whoami: {beats: [snapshot]}
  domains: {beats: [snapshot]}
  domain: {beats: [snapshot]}
  projects: {beats: [snapshot]}
  project: {beats: [snapshot]}
  users: {beats: [snapshot]}
  user: {beats: [snapshot]}
  orgs: {beats: [snapshot]}
  org: {beats: [snapshot]}
  tables: {beats: [snapshot]}
  views: {beats: [snapshot]}
  schemas: {beats: [snapshot]}
  schema: {beats: [snapshot]}
  records: {beats: [snapshot]}
  sources: {beats: [snapshot]}
  sessions: {beats: [snapshot]}
  templates: {beats: [snapshot]}
  screenshot: {beats: [snapshot]}
  elements: {beats: [snapshot]}
  displays: {beats: [snapshot]}
  devices: {beats: [snapshot]}
  drives: {beats: [snapshot]}
  version: {beats: [snapshot]}
  versions: {beats: [snapshot]}
  count: {beats: [snapshot]}
  sizes: {beats: [snapshot]}
  env: {beats: [snapshot]}
  context: {beats: [snapshot]}
  inject: {beats: [snapshot]}
  budget: {beats: [snapshot]}
  cost: {beats: [snapshot]}
  tree: {beats: [snapshot]}
  url: {beats: [snapshot]}
  title: {beats: [snapshot]}
  pages: {beats: [snapshot]}
  # Plural resource nouns: bare noun = list it (REST-wrapper convention).
  services: {beats: [snapshot]}
  deploys: {beats: [snapshot]}
  deployments: {beats: [snapshot]}
  jobs: {beats: [snapshot]}
  events: {beats: [snapshot]}
  instances: {beats: [snapshot]}
  metrics: {beats: [snapshot]}
  branches: {beats: [snapshot]}
  zones: {beats: [snapshot]}
  zone: {beats: [snapshot]}
  workers: {beats: [snapshot]}
  apps: {beats: [snapshot]}
  app: {beats: [snapshot]}
  groups: {beats: [snapshot]}
  pods: {beats: [snapshot]}
  regions: {beats: [snapshot]}
  functions: {beats: [snapshot]}
  extensions: {beats: [snapshot]}
  indexes: {beats: [snapshot]}
  locks: {beats: [snapshot]}
  connections: {beats: [snapshot]}
  relations: {beats: [snapshot]}
  profiles: {beats: [snapshot]}
  profile: {beats: [snapshot]}
  owners: {beats: [snapshot]}
  repos: {beats: [snapshot]}
  prs: {beats: [snapshot]}
  pr: {beats: [snapshot]}
  inbox: {beats: [snapshot]}
  awaiting: {beats: [snapshot]}
  threads: {beats: [snapshot]}
  checks: {beats: [snapshot]}
  claims: {beats: [snapshot]}
  publishes: {beats: [snapshot]}
  aliases: {beats: [snapshot]}
  mailboxes: {beats: [snapshot]}
  secrets: {beats: [snapshot], attributes: [sensitive]}
  ps: {beats: [snapshot]}
  log: {beats: [snapshot]}
  ls: {beats: [snapshot]}

  # ── connect: establish a usable session/attachment ──
  connect: {beats: [connect]}
  open: {beats: [connect]}
  login: {beats: [connect]}
  attach: {beats: [connect]}
  boot: {beats: [connect]}
  init: {beats: [connect]}
  join: {beats: [connect]}
  doctor: {beats: [connect, verify], attributes: [composite]}

  # ── verify: pass/fail or block-until ──
  wait: {beats: [verify]}
  validate: {beats: [verify]}
  test: {beats: [verify]}
  verify: {beats: [verify]}
  audit: {beats: [verify]}

  # ── interact: mutate state ──
  create: {beats: [interact]}
  new: {beats: [interact]}
  add: {beats: [interact]}
  set: {beats: [interact]}
  update: {beats: [interact]}
  edit: {beats: [interact]}
